# СГЕНЕРИРОВАННАЯ КОПИЯ — НЕ РЕДАКТИРОВАТЬ.
# Источник правды: contract/openapi.yaml в приватной репе aggr-contract.
# Копия нужна потому, что Mintlify читает спеку только внутри репы доков.
# Обновление: ./scripts/sync-spec.sh (проверка расхождения: --check)
openapi: 3.1.0
info:
  title: Агрегатор — приём депозитов
  version: "1.0"
  contact:
    name: Поддержка Агрегатора
  description: |
    Вы создаёте заявку на депозит (`POST /v1/deposits`), Сервис маршрутизирует её в платёжную
    систему; клиент оплачивает — по выданным реквизитам (h2h) или на форме для оплаты (redirect).
    О состоянии заявки Сервис сообщает колбэком и отдаёт его по GET-статусу.
    Песочница позволяет пройти путь до подтверждённого платежа на моке — см. раздел «Песочница».

    Интеграция мерчанта с сервисом «Агрегатор» для приёма депозитов (v1).
    Выплаты в текущую версию не входят. Хост API, ключи и списки IP сообщаются при подключении.

    ## Как проходит платёж

    ```
    Мерчант                Агрегатор            Платёжная система         Клиент
       │  POST /v1/deposits    │  запрос реквизитов     │                      │
       ├──────────────────────►├───────────────────────►│                      │
       │  200: transaction_id, │                        │                      │
       │  PENDING / ISSUING_REQUISITES                  │                      │
       │◄──────────────────────┤                        │                      │
       │                       │ requisites — h2h /     │                      │
       │                       │ redirect_url — redirect│                      │
       │                       │◄───────────────────────┤                      │
       │  GET /v1/deposits/{transaction_id}             │                      │
       ├──────────────────────►│                        │                      │
       │  requisites /         │                        │                      │
       │  redirect_url         │                        │                      │
       │◄──────────────────────┤                        │                      │
       │  реквизиты или форма для оплаты — клиенту      │                      │
       ├────────────────────────────────────────────────┼─────────────────────►│
       │                       │                        │◄─── оплата ──────────┤
       │  колбэк на callback_url                        │                      │
       │◄──────────────────────┤                        │                      │
       │  GET /v1/deposits/{transaction_id}             │                      │
       ├──────────────────────►│                        │                      │
       │  финальный статус     │                        │                      │
       │◄──────────────────────┤                        │                      │
    ```

    1. Создайте депозит `POST /v1/deposits`, указав вариант интеграции (`flow`), метод оплаты (`method`: `sbp` | `nspk` | `transgran` | `c2c`) и при необходимости банк (`bank`).
       Через какую платёжную систему пойдёт платёж — по умолчанию решает Сервис; при закреплённом за вами маршруте укажите её полем `psp`.
    2. Заберите артефакт вашего варианта из `GET /v1/deposits/{transaction_id}`: реквизиты (`requisites` + `pay_amount`, h2h) покажите клиенту, на форму для оплаты (`redirect_url`, redirect) — направьте его.
       Пока артефакта нет (`stage = ISSUING_REQUISITES`) — покажите клиенту ожидание и опрашивайте статус.
    3. Клиент оплачивает: переводит `pay_amount` по выданным реквизитам до `expires_at` (h2h) или платит на форме для оплаты и возвращается на ваш `success_url` / `pending_url` / `fail_url` (redirect).
    4. При смене статуса Сервис отправит колбэк на ваш `callback_url`.
    5. Получив колбэк, запросите `GET /v1/deposits/{transaction_id}` и зафиксируйте статус.

    > **Источник истины о статусе** — ответ `GET /v1/deposits/{transaction_id}`.
    > Колбэк — сигнал «статус изменился, запросите его», а не носитель финансовых данных.

    > ↓ Чем h2h отличается от redirect — «Варианты интеграции» ниже. Словарь состояний — «Заявка: статус и этап» ниже.

    ## Варианты интеграции: h2h и redirect

    Сервис обрабатывает депозит одним из двух вариантов интеграции. Вариант интеграции указывается обязательным полем
    `flow` в каждом запросе создания: `h2h` или `redirect`.
    Вариант интеграции, недоступный вашему подключению, — `422 FLOW_NOT_ALLOWED`, заявка не создаётся.

    |  | `h2h` | `redirect` |
    |---|---|---|
    | Ответ создания | `200` — заявка создана, реквизиты придут в GET-статусе | `200` — заявка создана, `redirect_url` придёт в GET-статусе |
    | Реквизиты клиенту показывает | вы, в своём интерфейсе | форма для оплаты (`redirect_url`) |
    | `success_url` / `pending_url` / `fail_url` | не используются | обязательны |
    | Что придёт в GET-статусе | `requisites` (платёжные, полные) + `pay_amount` | `redirect_url` — форма для оплаты |
    | Статусы, этапы, колбэки, GET, отмена | общие для обоих вариантов | общие для обоих вариантов |
    | Когда выбирать | оплата должна остаться в вашем интерфейсе | клиента можно перенаправить на форму для оплаты |

    Как проходит платёж в h2h:

    ```
    Мерчант                Агрегатор            Платёжная система         Клиент
       │  POST /v1/deposits    │  запрос реквизитов     │                      │
       ├──────────────────────►├───────────────────────►│                      │
       │  200: заявка создана  │       requisites       │                      │
       │◄──────────────────────┤◄───────────────────────┤                      │
       │  GET /v1/deposits/{transaction_id}             │                      │
       ├──────────────────────►│                        │                      │
       │  requisites,          │                        │                      │
       │  pay_amount           │                        │                      │
       │◄──────────────────────┤                        │                      │
       │  показываете реквизиты клиенту                 │                      │
       ├────────────────────────────────────────────────┼─────────────────────►│
       │                       │                        │◄─── перевод ─────────┤
       │  колбэк на callback_url                        │                      │
       │◄──────────────────────┤                        │                      │
    ```

    - Реквизиты возвращает платёжная система — Сервис передаёт их вам в ответе
      `GET /v1/deposits/{transaction_id}`; там же придёт `pay_amount`. В ответе создания
      реквизитов нет: заявка создаётся со `stage = ISSUING_REQUISITES`; пока реквизиты
      не выданы — покажите клиенту ожидание и опрашивайте статус.
    - Клиент переводит сумму `pay_amount` (если поля нет — `amount`) строго по выданным
      реквизитам до `expires_at`.
    - Если в `requisites` есть `instruction` — покажите её клиенту явным текстом целиком:
      без этого перевод может не дойти.

    Как проходит платёж в redirect:

    ```
    Мерчант                Агрегатор            Платёжная система         Клиент
       │  POST /v1/deposits    │  запрос реквизитов     │                      │
       ├──────────────────────►├───────────────────────►│                      │
       │  200: заявка создана  │      redirect_url      │                      │
       │◄──────────────────────┤◄───────────────────────┤                      │
       │  GET /v1/deposits/{transaction_id}             │                      │
       ├──────────────────────►│                        │                      │
       │  redirect_url         │                        │                      │
       │◄──────────────────────┤                        │                      │
       │  редирект клиента на redirect_url              │  форма для оплаты    │
       ├────────────────────────────────────────────────┼─────────────────────►│
       │                       │                        │◄─── оплата ──────────┤
       │  колбэк на callback_url                        │                      │
       │◄──────────────────────┤                        │                      │
       │  GET /v1/deposits/{transaction_id}             │                      │
       ├──────────────────────►│                        │                      │
       │  финальный статус     │                        │                      │
       │◄──────────────────────┤                        │                      │
    ```

    - `redirect_url` придёт в ответе `GET /v1/deposits/{transaction_id}`, когда форма для оплаты
      готова. В ответе создания его нет: заявка создаётся со `stage = ISSUING_REQUISITES`;
      пока форма не готова — покажите клиенту ожидание и опрашивайте статус.
    - `success_url` / `pending_url` / `fail_url` обязательны: после оплаты клиент вернётся
      на один из них.
    - `requisites` в GET-статусе здесь — справочная маскированная копия, платить по ней
      не нужно: полные реквизиты клиент видит на форме для оплаты.

    > ↓ Пошаговые сценарии обоих вариантов — «Сценарии: пути заявки» ниже.

    ## Сценарии: пути заявки

    Пути заявки шаг за шагом: в каждом шаге — вызов, значимые поля ответа и что делать дальше; строки «↓ …» — что происходит между вашими вызовами. Сначала вариант h2h, затем redirectUrl.

    ### Сценарий: Оплата (h2h)

    Путь заявки от создания до зачисления: 4 вызова — 1 POST + 3 GET;
    между вызовами действуют платёжная система и клиент.

    Траектория: `PENDING / ISSUING_REQUISITES` → `PENDING / AWAITING_PAYMENT` → `SUCCESS / SETTLED`

    В ответах ниже — только значимые для шага поля; полные тела и коды ошибок — в операциях `POST /v1/deposits` и `GET /v1/deposits/{transaction_id}` ниже. Прогнать путь вживую — папка коллекции «Вариант интеграции h2h → Сценарий 1: Оплата» (см. раздел «Песочница»): Run проигрывает шаги 1–4 подряд, мок-заголовки уже вшиты в запросы, подписи мок не требует.

    **Шаг 1 · Создать депозит (h2h) · `PENDING / ISSUING_REQUISITES`**

    `POST /v1/deposits` — обязательные в теле: `"flow": "h2h"`, `method` (метод оплаты: `sbp` | `nspk` | `transgran` | `c2c`), `amount`, `currency`, `order_id`, `callback_url`; необязательные: `bank` (банк, выбранный клиентом, — в нём при наличии выдадут реквизиты), `psp`, `customer_account_id`, `fields`. Разбор каждого поля — таблица «Поля запроса» в `POST /v1/deposits` ниже.

    ```
    200 OK
    {
      "transaction_id": "8a4b6c1d-…",  ← ключ заявки
      "status": "PENDING",             ← исход: заявка идёт
      "stage": "ISSUING_REQUISITES",   ← реквизиты готовятся
      "expires_at": "2026-07-20T15:15:00Z"
                                       ← дедлайн оплаты
    }
    ```

    мок (песочница): `Deposit created (H2H)`

    Сохраните `transaction_id` — все вызовы ниже идут по нему; клиенту покажите ожидание. Реквизитов в ответе создания нет и не будет — они придут только в GET-статусе → шаг 2.

    ↓ платёжная система выпускает реквизиты — опрашивайте статус до смены этапа

    **Шаг 2 · Статус: реквизиты выпускаются · `PENDING / ISSUING_REQUISITES`**

    `GET /v1/deposits/{transaction_id}`

    ```
    200 OK
    {
      "status": "PENDING",             ← без изменений
      "stage": "ISSUING_REQUISITES"    ← всё ещё готовятся
    }
    ```

    мок (песочница): `Pending H2H (issuing)`

    Этап не сменился — продолжайте опрос → шаг 3.

    ↓ платёжная система выдала реквизиты — очередной опрос приносит их

    **Шаг 3 · Статус: реквизиты выданы · `PENDING / AWAITING_PAYMENT`**

    `GET /v1/deposits/{transaction_id}`

    ```
    200 OK
    {
      "status": "PENDING",             ← исход не изменился
      "stage": "AWAITING_PAYMENT",     ← этап: ждём оплату
    + "psp": "psp-slug",               ← система, выдавшая реквизиты
    + "pay_amount": 5000.37,           ← сумма к переводу
    + "requisites": {                  ← артефакт h2h
        "phone": "+79269876543",
        "bank_name": "Т-Банк",
        "recipient_name": "Пётр С."
      }
    }
    ```

    мок (песочница): `Pending H2H (payable requisites)`

    Покажите клиенту реквизиты целиком, сумму `pay_amount` (не `amount`!) и срок `expires_at`; `instruction`, если пришла, — тоже целиком. Клиент переводит деньги — ждите колбэк на `callback_url` → шаг 4.

    ↓ клиент переводит `pay_amount` по реквизитам до `expires_at` — Сервис присылает колбэк (в песочнице колбэков нет — шаг 4 выполняйте сразу)

    **Шаг 4 · Статус: оплачена · `SUCCESS / SETTLED`**

    `GET /v1/deposits/{transaction_id}` — по сигналу колбэка

    ```
    200 OK
    {
      "status": "SUCCESS",             ← исход: деньги получены
      "stage": "SETTLED",              ← финал: зачислена
    + "paid_amount": 5000.37           ← зачисляйте именно его
    }
    ```

    мок (песочница): `Success (SETTLED, h2h)`

    Зачислите `paid_amount`, сверив с `pay_amount` (нет поля — с `amount`). Заявка финальна — статус больше не изменится, но колбэки слушайте дальше: возможен возврат.

    **Развилки с этого пути**

    - клиент не оплатил до `expires_at` → «Сценарий: Истечение» ниже
    - вы отменили заявку до оплаты → «Сценарий: Отмена» ниже
    - деньги отозваны после успеха → «Сценарий: Возврат (chargeback)» ниже

    ↓ Поля запросов и ответов, полные тела и код подписи — справочник ручек ниже; словарь пар `status` / `stage` — раздел «Заявка: статус и этап».

    *Нотация: `←` — что делать с полем; `+` — поле впервые появилось в этом ответе; строка `↓ …` — что происходит между вашими вызовами; «мок (песочница):» — имя ответа песочницы, отвечающего на этом шаге.*

    ### Сценарий: Возврат (chargeback)

    Возврат (chargeback) — путь уже оплаченной заявки: 2 вызова — оба GET;
    между ними платёжная система проводит возврат, ручки для него нет.

    Траектория: `SUCCESS / SETTLED` → `FAILED / REVERSED`

    Путь общий для обоих вариантов интеграции — заявка после возврата выглядит в h2h и redirect одинаково. В ответах ниже — только значимые для шага поля; полные тела и коды ошибок — в операции `GET /v1/deposits/{transaction_id}` ниже. Прогнать путь вживую — папка коллекции «Вариант интеграции h2h → Сценарий 2: Возврат (chargeback)» (см. раздел «Песочница»): Run проигрывает оба шага подряд, мок-заголовки уже вшиты в запросы, подписи мок не требует.

    **Шаг 1 · Статус: оплачена · `SUCCESS / SETTLED`**

    `GET /v1/deposits/{transaction_id}`

    ```
    200 OK
    {
      "status": "SUCCESS",             ← исход: деньги получены
      "stage": "SETTLED",              ← финал: зачислена
      "paid_amount": 1500.37           ← вы его уже зачислили
    }
    ```

    мок (песочница): `Success (SETTLED)`

    Точка старта — успешно зачисленная заявка: `paid_amount` вы уже зачислили (в песочнице финал возврата показан на справочной заявке). Для вас заявка закрыта, но не для платёжной системы — колбэки слушайте дальше → шаг 2.

    ↓ платёжная система провела возврат — Сервис присылает колбэк (в песочнице колбэков нет — шаг 2 выполняйте сразу)

    **Шаг 2 · Статус: возврат · `FAILED / REVERSED`**

    `GET /v1/deposits/{transaction_id}` — по сигналу колбэка

    ```
    200 OK
    {
      "status": "FAILED",              ← исход: деньги отозваны
      "stage": "REVERSED",             ← финал: возврат прошёл
      "paid_amount": 1500.37,          ← сторнируйте целиком
    + "reversal": {                    ← детали возврата
        "occurred_at": "2026-07-31T09:12:00Z",
                                       ← время возврата
        "amount": 1500.37,             ← всегда = paid_amount
        "reason": "DISPUTE_LOST"       ← причина, если известна
      },
    + "error": {                       ← пояснение, не парсить
        "message": "Платёж возвращён — chargeback"
      }
    }
    ```

    мок (песочница): `Reversed (chargeback)`

    Сторнируйте `paid_amount` целиком — возврат всегда полный, `reversal.amount` ему равен. Ручки возврата нет: его проводит платёжная система, вы узнаёте о нём из колбэка и подтверждаете GET-статусом. Блок `reversal` остаётся в ответе навсегда.

    **Развилки с этого пути**

    - возврат отменён по апелляции: заявка снова `SUCCESS / SETTLED`, придёт новый колбэк → «Возврат и апелляция» ниже

    ↓ справочник ручек и полные тела — ниже

    *Нотация: `←` — что делать с полем; `+` — поле впервые появилось в этом ответе; строка `↓ …` — что происходит между вашими вызовами; «мок (песочница):» — имя ответа песочницы, отвечающего на этом шаге.*

    ### Сценарий: Истечение

    Путь заявки, когда клиент так и не оплатил: 2 вызова — оба GET;
    между ними истекает срок `expires_at`.

    Траектория: `PENDING / AWAITING_PAYMENT` → `FAILED / EXPIRED`

    В ответах ниже — только значимые для шага поля; полные тела и коды ошибок —
    в операции `GET /v1/deposits/{transaction_id}` ниже.

    **Шаг 1 · Статус: ждём оплату · `PENDING / AWAITING_PAYMENT`**

    `GET /v1/deposits/{transaction_id}`

    ```
    200 OK
    {
      "status": "PENDING",             ← исход: заявка идёт
      "stage": "AWAITING_PAYMENT",     ← этап: ждём оплату
      "pay_amount": 5000.37,           ← сумма к переводу
      "requisites": {                  ← полные, платёжные
        "phone": "+79269876543",
        "bank_name": "Т-Банк",
        "recipient_name": "Пётр С."
      },
      "expires_at": "2026-07-20T15:15:00Z"
                                       ← дедлайн оплаты —
                                         клиент его пропустит
    }
    ```

    мок (песочница): `Pending H2H (payable requisites)`

    Тот же шаг, что в «Сценарии 1: Оплата»: клиент видит реквизиты, `pay_amount`
    (не `amount`!) и срок `expires_at`; в redirect артефакт этого шага — `redirect_url`,
    а `requisites` — справочная маскированная копия. Дальше — ветка неоплаты:
    клиент денег не переводит → шаг 2.

    ↓ клиент не оплатил до `expires_at` — заявка истекла, Сервис присылает колбэк на `callback_url`

    **Шаг 2 · Статус: истекла · `FAILED / EXPIRED`**

    `GET /v1/deposits/{transaction_id}` — по сигналу колбэка

    ```
    200 OK
    {
      "status": "FAILED",              ← исход: денег не будет
      "stage": "EXPIRED",              ← финал: срок истёк
      "requisites": {                  ← после истечения —
                                         только маска
        "card_number": "220012******9012",
        "bank_name": "Т-Банк",
        "recipient_name": "Пётр С."
      },
    + "error": {                       ← причина неуспеха
        "message": "Клиент не оплатил заявку до истечения срока"
      }
    }
    ```

    мок (песочница): `Failed (EXPIRED)`

    Заявка финальна: денег не будет — покажите клиенту неуспех; причина — в
    `error.message`, поля `reason` у истечения нет. Полные реквизиты Сервис дольше
    срока жизни заявки не хранит — маска остаётся единственным следом. Новая попытка
    оплаты — только новый депозит с новым `order_id`. Колбэки слушайте дальше:
    возможна апелляция (`FAILED` → `SUCCESS / SETTLED`).

    **Развилки с этого пути**

    - клиент всё же оплатил до `expires_at` → «Сценарий: Оплата (h2h)» ниже
    - вы отменили заявку до истечения → «Сценарий: Отмена» ниже

    ↓ справочник ручек и полные тела — ниже

    *Нотация: `←` — что делать с полем; `+` — поле впервые появилось в этом ответе; строка `↓ …` — что происходит между вашими вызовами; «мок (песочница):» — имя ответа песочницы, отвечающего на этом шаге.*

    ### Сценарий: Отмена

    Отмена заявки в `PENDING`: 2 вызова — 1 POST + 1 GET;
    отмена — просьба, а не гарантия: она конкурирует с оплатой клиента.

    Траектория: `PENDING / CANCELING` → `FAILED / CANCELED` (гонка: `SUCCESS / SETTLED`)

    В ответах ниже — только значимые для шага поля; полные тела и коды ошибок — в операциях `POST /v1/deposits/{transaction_id}/cancel` и `GET /v1/deposits/{transaction_id}` ниже. Прогнать путь вживую — папка коллекции «Сценарий 4: Отмена» в вашем варианте интеграции (см. раздел «Песочница»): Run проигрывает шаги подряд, мок-заголовки уже вшиты в запросы, подписи мок не требует.

    **Шаг 1 · Отменить: принято · `PENDING / CANCELING`**

    `POST /v1/deposits/{transaction_id}/cancel` — тело пустое, подпись от пустой строки (как у GET)

    ```
    202 Accepted
    {
      "status": "PENDING",             ← исход ещё не решён
      "stage": "CANCELING"             ← отмена принята
    }
    ```

    мок (песочница): `Cancel accepted`

    Заявка перешла в этап `CANCELING`, исход ещё не решён. Повтор запроса в этом состоянии безопасен — снова вернёт `202`. Исход придёт колбэком на `callback_url` → шаг 2.

    ↓ платёжная система решает гонку «отмена или оплата» — Сервис присылает колбэк с исходом (в песочнице колбэков нет — шаг 2 выполняйте сразу)

    **Шаг 2 · Статус: отменена · `FAILED / CANCELED`**

    `GET /v1/deposits/{transaction_id}` — по сигналу колбэка

    ```
    200 OK
    {
      "status": "FAILED",              ← исход: денег нет
      "stage": "CANCELED",             ← финал: отменена
    + "error": {                       ← причина отказа
        "message": "Заявка отменена по вашему запросу"
      }
    }
    ```

    мок (песочница): `Canceled (by merchant)`

    Заявка финальна; `error.message` можно показать клиенту. Колбэки слушайте дальше: для `FAILED` возможна апелляция — заявка может стать `SUCCESS / SETTLED`. Пришёл `SUCCESS / SETTLED` вместо отмены — клиент успел оплатить → «Развилки».

    **Развилки: условие → ответ**

    **Заявка уже в исходе → `409 ALREADY_FINALIZED`**

    `POST /v1/deposits/{transaction_id}/cancel`

    ```
    409 Conflict
    {
      "error": {
        "code": 4091,
        "reason": "ALREADY_FINALIZED", ← заявка уже в исходе
        "message": "deposit already finalized, …"
      }
    }
    ```

    мок (песочница): `Already finalized`

    Заявка уже `SUCCESS` или `FAILED` — отменять нечего. Узнайте фактический исход: `GET /v1/deposits/{transaction_id}` — и действуйте по нему.

    **Этап `VERIFYING` / `DISPUTING` → `409 CANCEL_NOT_AVAILABLE`**

    `POST /v1/deposits/{transaction_id}/cancel`

    ```
    409 Conflict
    {
      "error": {
        "code": 4092,
        "reason": "CANCEL_NOT_AVAILABLE",
                                       ← этап не допускает
        "message": "current stage does not allow cancellation"
      }
    }
    ```

    мок (песочница): `Cancel not available`

    Платёж уже в обработке (`VERIFYING`, `DISPUTING`) — отмена недоступна. Дождитесь исхода заявки — он придёт колбэком.

    **Клиент успел оплатить → `200 SUCCESS / SETTLED` (гонка)**

    `GET /v1/deposits/{transaction_id}`

    ```
    200 OK
    {
      "status": "SUCCESS",             ← оплата победила отмену
      "stage": "SETTLED",              ← финал: зачислена
      "paid_amount": 1500.37,          ← зачисляйте именно его
      "paid_at": "2026-07-17T14:40:58Z"
    }
    ```

    мок (песочница): `Success (SETTLED)`

    Отмена не состоялась: клиент успел оплатить. Зачислите `paid_amount`, сверив с `pay_amount`, — как при обычной оплате.

    ↓ Справочник ручек и полные тела — ниже.

    *Нотация: `←` — что делать с полем; `+` — поле впервые появилось в этом ответе; строка `↓ …` — что происходит между вашими вызовами; «мок (песочница):» — имя ответа песочницы, отвечающего на этом шаге.*

    ### Сценарий: Реквизиты по методам

    Реквизиты возвращает платёжная система — состав зависит от `method`. Все четыре ответа ниже — на один и тот же вызов, заявка в `PENDING / AWAITING_PAYMENT`:

    `GET /v1/deposits/{transaction_id}`

    Состав по методам:

    | Метод | Поля | Особенность |
    |---|---|---|
    | `sbp` | `phone`, `bank`, `bank_name`, `recipient_name` | перевод по телефону; `bank` — информационный |
    | `c2c` | `card_number`, `bank`, `bank_name`, `recipient_name` | перевод по номеру карты |
    | `nspk` | `payment_url`, `qr_data`, `qr_image_url` | QR рендерите сами из `qr_data` или берите готовую картинку `qr_image_url` |
    | `transgran` | `card_number` или `phone`, `bank_name`, `payment_currency`, `instruction` | `instruction` присутствует всегда — покажите клиенту целиком |

    В фенсах ниже — только `method` и `requisites`; поле `instruction` показывайте клиенту явным текстом целиком.

    **`sbp` · СБП — перевод по номеру телефона**

    ```
    200 OK
    {
      "method": "sbp",
      "requisites": {
        "phone": "+79269876543",     ← куда переводить
        "bank": "tbank",             ← информационный
        "bank_name": "Т-Банк",
        "recipient_name": "Пётр С."
      }
    }
    ```

    мок (песочница): `Pending H2H (payable requisites)`

    **`c2c` · перевод по номеру карты**

    ```
    200 OK
    {
      "method": "c2c",
      "requisites": {
        "card_number": "2200 1234 5678 9012",
                                     ← куда переводить
        "bank": "tbank",
        "bank_name": "Т-Банк",
        "recipient_name": "Пётр С."
      }
    }
    ```

    мок (песочница): `Pending H2H (c2c)`

    **`nspk` · НСПК — оплата по QR-коду / платёжной ссылке**

    ```
    200 OK
    {
      "method": "nspk",
      "requisites": {
        "payment_url": "https://qr.nspk.ru/AS10001234567890",
                                     ← платёжная ссылка
        "qr_data": "https://qr.nspk.ru/AS10001234…",
                                     ← данные для рендера QR
        "qr_image_url": "https://cdn.agg.example/qr/…"
                                     ← готовая картинка QR
      }
    }
    ```

    мок (песочница): `Pending H2H (nspk)`

    **`transgran` · трансграничный перевод с инструкцией**

    ```
    200 OK
    {
      "method": "transgran",
      "requisites": {
        "card_number": "9860 1234 5678 9012",
                                     ← куда переводить
        "bank_name": "АТБ Банк",
        "payment_currency": "AMD",   ← валюта оплаты
        "instruction": "Перевод только из мобильн…"
                                     ← покажите целиком
      }
    }
    ```

    мок (песочница): `Pending H2H (transgran)`

    ↓ справочник ручек и полные тела — ниже

    *Нотация: `←` — что делать с полем; «мок (песочница):» — имя ответа песочницы, отвечающего на этом вызове.*

    ### Сценарий: Оплата (redirectUrl)

    Путь заявки от создания до зачисления: 4 вызова — 1 POST + 3 GET;
    между вызовами действуют платёжная система и клиент.

    Траектория: `PENDING / ISSUING_REQUISITES` → `PENDING / AWAITING_PAYMENT` → `SUCCESS / SETTLED`

    В ответах ниже — только значимые для шага поля; полные тела и коды ошибок — в операциях `POST /v1/deposits` и `GET /v1/deposits/{transaction_id}` ниже. Прогнать путь вживую — папка коллекции «Вариант интеграции redirectUrl → Сценарий 1: Оплата» (см. раздел «Песочница»): Run проигрывает шаги 1–4 подряд, мок-заголовки уже вшиты в запросы, подписи мок не требует.

    **Шаг 1 · Создать депозит (redirect) · `PENDING / ISSUING_REQUISITES`**

    `POST /v1/deposits` — обязательные в теле: `"flow": "redirect"`, `method` (метод оплаты: `sbp` | `nspk` | `transgran` | `c2c`), `amount`, `currency`, `order_id`, `callback_url`, `success_url`, `pending_url`, `fail_url`; необязательные: `bank` (банк, выбранный клиентом, — в нём при наличии выдадут реквизиты), `psp`, `customer_account_id`, `fields`. Разбор каждого поля — таблица «Поля запроса» в `POST /v1/deposits` ниже.

    ```
    200 OK
    {
      "transaction_id": "9f3c2a71-…",  ← ключ заявки
      "status": "PENDING",             ← исход: заявка идёт
      "stage": "ISSUING_REQUISITES",   ← форма готовится
      "expires_at": "2026-07-17T14:45:45Z"
                                       ← дедлайн оплаты
    }
    ```

    мок (песочница): `Deposit created`

    Сохраните `transaction_id` — все вызовы ниже идут по нему; клиенту покажите ожидание. Ссылки на форму в ответе создания нет и не будет — `redirect_url` придёт только в GET-статусе → шаг 2.

    ↓ платёжная система готовит форму для оплаты — опрашивайте статус до смены этапа

    **Шаг 2 · Статус: готовится форма · `PENDING / ISSUING_REQUISITES`**

    `GET /v1/deposits/{transaction_id}`

    ```
    200 OK
    {
      "status": "PENDING",             ← без изменений
      "stage": "ISSUING_REQUISITES"    ← всё ещё готовится
    }
    ```

    мок (песочница): `Pending (issuing)`

    Этап не сменился — продолжайте опрос → шаг 3.

    ↓ платёжная система выдала форму для оплаты — очередной опрос приносит ссылку на неё

    **Шаг 3 · Статус: ждём оплату · `PENDING / AWAITING_PAYMENT`**

    `GET /v1/deposits/{transaction_id}`

    ```
    200 OK
    {
      "status": "PENDING",             ← исход не изменился
      "stage": "AWAITING_PAYMENT",     ← этап: ждём оплату
    + "psp": "psp-slug",               ← система, выдавшая реквизиты
    + "redirect_url": "https://pay.example/p/ab12cd34ef56",
                                       ← артефакт redirect
    + "pay_amount": 1500.37,           ← сумма к оплате
    + "requisites": {                  ← справочная копия —
        "phone": "+7926***6543",         платить по ней
        "bank_name": "Т-Банк",           не нужно
        "recipient_name": "Пётр С."
      }
    }
    ```

    мок (песочница): `Pending (AWAITING_PAYMENT)`

    Направьте клиента на `redirect_url` — он оплатит `pay_amount` на форме для оплаты до `expires_at`. Маскированные `requisites` — справочная копия, платить по ней не нужно. Клиент оплачивает — ждите колбэк на `callback_url` → шаг 4.

    ↓ клиент оплачивает `pay_amount` на форме до `expires_at` — Сервис присылает колбэк (в песочнице колбэков нет — шаг 4 выполняйте сразу)

    **Шаг 4 · Статус: оплачена · `SUCCESS / SETTLED`**

    `GET /v1/deposits/{transaction_id}` — по сигналу колбэка

    ```
    200 OK
    {
      "status": "SUCCESS",             ← исход: деньги получены
      "stage": "SETTLED",              ← финал: зачислена
    + "paid_amount": 1500.37           ← зачисляйте именно его
    }
    ```

    мок (песочница): `Success (SETTLED, redirect)`

    Зачислите `paid_amount`, сверив с `pay_amount` (нет поля — с `amount`). Заявка финальна — статус больше не изменится, но колбэки слушайте дальше: возможен возврат.

    **Развилки с этого пути**

    - клиент не оплатил до `expires_at` → «Сценарий: Истечение (redirectUrl)» ниже
    - вы отменили заявку до оплаты → «Сценарий: Отмена (redirectUrl)» ниже
    - деньги отозваны после успеха → «Сценарий: Возврат (chargeback, redirectUrl)» ниже

    ↓ Справочник ручек и полные тела — ниже; словарь пар `status` / `stage` — раздел «Заявка: статус и этап».

    *Нотация: `←` — что делать с полем; `+` — поле впервые появилось в этом ответе; строка `↓ …` — что происходит между вашими вызовами; «мок (песочница):» — имя ответа песочницы, отвечающего на этом шаге.*

    ### Сценарий: Возврат (chargeback, redirectUrl)

    Путь заявки после успеха — деньги отозваны: 2 вызова GET; между ними платёжная система отзывает платёж (chargeback). Ручки возврата нет — о переходе узнаёте из колбэка. Путь возврата одинаков для обоих вариантов интеграции; `redirect_url` в этих ответах уже не участвует — заявка оплачена.

    Траектория: `SUCCESS / SETTLED` → `FAILED / REVERSED`

    В ответах ниже — только значимые для шага поля; полные тела и коды ошибок — в операции `GET /v1/deposits/{transaction_id}` ниже. Прогнать путь вживую — папка коллекции «Вариант интеграции redirectUrl → Сценарий 2: Возврат (chargeback)» (см. раздел «Песочница»): Run проигрывает шаги 1–2 подряд, мок-заголовки уже вшиты в запросы, подписи мок не требует.

    **Шаг 1 · Статус: оплачена · `SUCCESS / SETTLED`**

    `GET /v1/deposits/{transaction_id}`

    ```
    200 OK
    {
      "status": "SUCCESS",             ← исход: деньги получены
      "stage": "SETTLED",              ← финал: зачислена
      "paid_amount": 1500.37           ← вы уже зачислили его
    }
    ```

    мок (песочница): `Success (SETTLED)`

    Точка отсчёта: заявка оплачена и зачислена. Финал не навсегда — деньги могут быть отозваны; слушайте колбэки и после успеха → шаг 2.

    ↓ платёжная система отзывает платёж (chargeback) — Сервис присылает колбэк (в песочнице колбэков нет — шаг 2 выполняйте сразу)

    **Шаг 2 · Статус: возврат · `FAILED / REVERSED`**

    `GET /v1/deposits/{transaction_id}` — по сигналу колбэка

    ```
    200 OK
    {
      "status": "FAILED",              ← исход пересмотрен
      "stage": "REVERSED",             ← возврат: chargeback
      "paid_amount": 1500.37,          ← был зачислен ранее
    + "reversal": {                    ← детали возврата
        "occurred_at": "2026-07-31T09:12:00Z",
        "amount": 1500.37,             ← сторнируйте целиком
        "reason": "DISPUTE_LOST"
      },
    + "error": {                       ← пояснение для человека
        "message": "Платёж возвращён — chargeback"
      }
    }
    ```

    мок (песочница): `Reversed (chargeback)`

    Сторнируйте `paid_amount` целиком — возврат всегда полный, `reversal.amount` равен ему. Блок `reversal` останется в ответе навсегда; `error.message` — только пояснение, разбору не подлежит. Заявка снова финальна, но колбэки слушайте дальше: возможна апелляция — исход вернётся в `SUCCESS / SETTLED`.

    ↓ справочник ручек и полные тела — ниже

    *Нотация: `←` — что делать с полем; `+` — поле впервые появилось в этом ответе; строка `↓ …` — что происходит между вашими вызовами; «мок (песочница):» — имя ответа песочницы, отвечающего на этом шаге.*

    ### Сценарий: Истечение (redirectUrl)

    Путь заявки, которую клиент не оплатил вовремя: 2 вызова — 2 GET;
    между ними истекает срок `expires_at`.

    Траектория: `PENDING / AWAITING_PAYMENT` → `FAILED / EXPIRED`

    В ответах ниже — только значимые для шага поля; полные тела и коды ошибок — в операции `GET /v1/deposits/{transaction_id}` ниже. Прогнать путь вживую — папка коллекции «Вариант интеграции redirectUrl → Сценарий 3: Истечение» (см. раздел «Песочница»).

    **Шаг 1 · Статус: ждём оплату · `PENDING / AWAITING_PAYMENT`**

    `GET /v1/deposits/{transaction_id}`

    ```
    200 OK
    {
      "status": "PENDING",             ← исход: заявка идёт
      "stage": "AWAITING_PAYMENT",     ← этап: ждём оплату
      "redirect_url": "https://pay.example/p/ab12cd34ef56",
                                       ← форма для оплаты
      "expires_at": "2026-07-17T14:45:45Z"
                                       ← дедлайн оплаты
    }
    ```

    мок (песочница): `Pending (AWAITING_PAYMENT)`

    Клиент направлен на `redirect_url` — сумму и реквизиты ему показывает форма для оплаты. Ждите колбэк на `callback_url` или опрашивайте статус — до `expires_at` заявка ждёт оплату.

    ↓ клиент не оплатил до `expires_at` — заявка истекает, Сервис присылает колбэк (в песочнице колбэков нет — шаг 2 выполняйте сразу)

    **Шаг 2 · Статус: истекла · `FAILED / EXPIRED`**

    `GET /v1/deposits/{transaction_id}` — по сигналу колбэка

    ```
    200 OK
    {
      "status": "FAILED",              ← исход: не удалась
      "stage": "EXPIRED",              ← срок жизни истёк
    + "error": {                       ← причина текстом
        "message":
          "Клиент не оплатил заявку до истечения срока"
      }
    }
    ```

    мок (песочница): `Failed (EXPIRED)`

    Денег не было — ничего не зачисляйте; `error.message` — готовый текст причины для ваших логов. Исход получен, но колбэки слушайте дальше: возможна апелляция — `FAILED → SUCCESS / SETTLED`, узнаете колбэком.

    **Развилки с этого пути**

    - клиент успел оплатить до `expires_at` → «Сценарий: Оплата (redirectUrl)» ниже
    - вы отменили заявку до оплаты → «Сценарий: Отмена (redirectUrl)» ниже

    ↓ справочник ручек и полные тела — ниже

    *Нотация: `←` — что делать с полем; `+` — поле впервые появилось в этом ответе; строка `↓ …` — что происходит между вашими вызовами; «мок (песочница):» — имя ответа песочницы, отвечающего на этом шаге.*

    ### Сценарий: Отмена (redirectUrl)

    Путь заявки от просьбы об отмене до финала: 2 вызова — 1 POST + 1 GET;
    исход решает гонка отмены с оплатой клиента, поэтому после шагов — три развилки.

    Траектория: `PENDING / CANCELING` → `FAILED / CANCELED` (гонка: `SUCCESS / SETTLED`)

    Путь и развилки совпадают со сценарием «Отмена (h2h)» выше — различие одно: клиент платит на форме для оплаты, а не по реквизитам.

    В ответах ниже — только значимые для шага поля; полные тела и коды ошибок — в операциях `POST /v1/deposits/{transaction_id}/cancel` и `GET /v1/deposits/{transaction_id}` ниже. Прогнать путь вживую — папка коллекции «Вариант интеграции redirectUrl → Сценарий 4: Отмена» (см. раздел «Песочница»): Run проигрывает шаги и развилки подряд, мок-заголовки уже вшиты в запросы, подписи мок не требует.

    **Шаг 1 · Отменить депозит · `PENDING / CANCELING`**

    `POST /v1/deposits/{transaction_id}/cancel` — тело пустое, подпись от пустой строки

    ```
    202 Accepted
    {
      "transaction_id": "9f3c2a71-…",  ← снапшот заявки
      "status": "PENDING",             ← исход ещё не решён
      "stage": "CANCELING"             ← отмена в обработке
    }
    ```

    мок (песочница): `Cancel accepted`

    `202` — «принято», а не «отменено»: заявка ещё может закончиться оплатой → развилка «Гонка» ниже. Повтор запроса, пока идёт отмена, безопасен и снова вернёт `202` с тем же снапшотом. Ждите колбэк → шаг 2.

    ↓ платёжная система обрабатывает отмену — Сервис присылает колбэк с исходом (в песочнице колбэков нет — шаг 2 выполняйте сразу)

    **Шаг 2 · Статус: отменена · `FAILED / CANCELED`**

    `GET /v1/deposits/{transaction_id}` — по сигналу колбэка

    ```
    200 OK
    {
      "status": "FAILED",              ← исход: денег не будет
      "stage": "CANCELED",             ← финал: отменена
    + "error": {                       ← причина отмены
        "message": "Заявка отменена по вашему запросу"
      }
    }
    ```

    мок (песочница): `Canceled (by merchant)`

    Заявка финальна; `error.message` можно показать клиенту. Колбэки слушайте дальше: для `FAILED` возможна апелляция — заявка может стать `SUCCESS / SETTLED`.

    **Развилки с этого пути**

    **Развилка · Заявка уже в исходе · `409 ALREADY_FINALIZED`**

    `POST /v1/deposits/{transaction_id}/cancel` — вместо `202` в шаге 1

    ```
    409 Conflict
    {
      "error": {
        "code": 4091,
        "reason": "ALREADY_FINALIZED"  ← заявка уже в исходе
      }
    }
    ```

    мок (песочница): `Already finalized`

    Отменять нечего — заявка уже в `SUCCESS` или `FAILED`; актуальное состояние покажет GET-статус.

    **Развилка · Этап не допускает отмену · `409 CANCEL_NOT_AVAILABLE`**

    `POST /v1/deposits/{transaction_id}/cancel` — вместо `202` в шаге 1

    ```
    409 Conflict
    {
      "error": {
        "code": 4092,
        "reason": "CANCEL_NOT_AVAILABLE"
                                       ← платёж уже в обработке
      }
    }
    ```

    мок (песочница): `Cancel not available`

    На этапах, где платёж уже в обработке (`VERIFYING`, `DISPUTING`), отмена недоступна — дождитесь исхода.

    **Развилка · Гонка: оплата победила отмену · `SUCCESS / SETTLED`**

    `GET /v1/deposits/{transaction_id}` — вместо шага 2

    ```
    200 OK
    {
      "status": "SUCCESS",             ← клиент успел оплатить
      "stage": "SETTLED",              ← финал: зачислена
    + "paid_amount": 1500.37           ← зачисляйте именно его
    }
    ```

    мок (песочница): `Success (SETTLED)`

    Клиент успел оплатить на форме для оплаты до обработки отмены. Заявка успешна — зачислите `paid_amount`, сверив с `pay_amount` (нет поля — с `amount`).

    ↓ справочник ручек и полные тела — ниже

    *Нотация: `←` — что делать с полем; `+` — поле впервые появилось в этом ответе; строка `↓ …` — что происходит между вашими вызовами; «мок (песочница):» — имя ответа песочницы, отвечающего на этом шаге.*

    > ↓ Прогнать каждый сценарий на моке — сценарные папки коллекции (ссылка на форк — раздел «Песочница» ниже); значения `status` / `stage` — раздел «Заявка: статус и этап» ниже.

    ## Аутентификация и подпись

    При подключении вы получаете `x-api-key` (публичный ключ) и `secret_key` (секрет для HMAC; в запросах никогда не передаётся).
    Токены (Bearer/JWT/OAuth) не используются — каждый запрос самодостаточен.

    Подпись каждого сообщения (и ваших запросов, и колбэков Сервиса):

    ```
    x-signature = hex( HMAC_SHA256( secret_key, raw_body ) )   — hex в нижнем регистре
    ```

    - `raw_body` — сырое тело **байт-в-байт**, как оно отправляется: без переформатирования, смены порядка полей и пробелов.
    - Для GET-запросов тело — пустая строка `""`.
    - Любое изменение сырого тела даст другую подпись → `401 INVALID_SIGNATURE`.

    ### Примеры расчёта подписи

    **curl + openssl**

    ```sh
    # POST — подписывайте и отправляйте одну и ту же переменную
    BODY='{"order_id":"ORDER-1001","amount":1500.00,"currency":"RUB","method":"sbp","flow":"h2h","bank":"tbank","callback_url":"https://merchant.example/payments/callback"}'
    SIGNATURE=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$SECRET_KEY" -hex | sed 's/^.* //')

    curl -s -X POST https://api.example/v1/deposits \
      -H "content-type: application/json" \
      -H "x-api-key: $API_KEY" \
      -H "x-signature: $SIGNATURE" \
      -d "$BODY"

    # GET (и POST /cancel — тело пустое) — подпись пустой строки
    SIGNATURE_GET=$(printf '%s' '' | openssl dgst -sha256 -hmac "$SECRET_KEY" -hex | sed 's/^.* //')

    curl -s https://api.example/v1/deposits/9f3c2a71-0d6e-4c1b-8a52-3f9e12ab34cd \
      -H "x-api-key: $API_KEY" \
      -H "x-signature: $SIGNATURE_GET"
    ```

    **Node.js**

    ```js
    import { createHmac } from "node:crypto";

    function sign(rawBody, secretKey) {
      return createHmac("sha256", secretKey).update(rawBody).digest("hex");
    }

    // POST — подписывайте ровно ту строку, которую отправите в запросе
    const rawBody = JSON.stringify({
      order_id: "ORDER-1001",
      amount: 1500.0,
      currency: "RUB",
      method: "sbp",
      flow: "h2h",
      bank: "tbank",
      callback_url: "https://merchant.example/payments/callback",
    });
    const signature = sign(rawBody, process.env.SECRET_KEY);

    // GET — тела нет, подписываем пустую строку
    const signatureForGet = sign("", process.env.SECRET_KEY);
    ```

    **Python**

    ```python
    import hmac
    import hashlib
    import json

    def sign(raw_body: str, secret_key: str) -> str:
        return hmac.new(secret_key.encode(), raw_body.encode(), hashlib.sha256).hexdigest()

    # POST — подписывайте ровно ту строку, которую отправите в запросе
    raw_body = json.dumps({
        "order_id": "ORDER-1001",
        "amount": 1500.00,
        "currency": "RUB",
        "method": "sbp",
        "flow": "h2h",
        "bank": "tbank",
        "callback_url": "https://merchant.example/payments/callback",
    })
    signature = sign(raw_body, secret_key)

    # GET — тела нет, подписываем пустую строку
    signature_for_get = sign("", secret_key)
    ```

    **Частые ошибки**

    - **Подписывайте байты, не объект.** Если собрать тело в объект, подписать его, а затем сериализовать отдельно для отправки — порядок ключей или пробелы разойдутся с реально отправленными байтами, и подпись не совпадёт → `401 INVALID_SIGNATURE`.
    - **Для GET подписывайте именно пустую строку `""`,** а не пропускайте заголовок `x-signature` — его отсутствие не заменяет подпись пустого тела.

    **Ротация ключей** — не реже раза в 90 дней, без остановки трафика через окно двух ключей:
    в переходном окне Сервис принимает подпись и старым, и новым ключом; колбэки подписываются ключом,
    чей `x-api-key` указан в заголовке колбэка. По окончании окна старый ключ → `401 UNKNOWN_API_KEY`.

    ## Идемпотентность

    Ключ идемпотентности создания депозита — ваш `order_id` (уникальность контролируется бессрочно):

    - повтор с тем же `order_id` и **тем же телом** (байт-в-байт) → `200` с ранее созданным депозитом;
    - повтор с тем же `order_id`, но другим телом → `409 DUPLICATE_ORDER_ID`;
    - новая попытка оплаты — всегда новый `order_id`.

    ## Заявка: статус и этап

    Вы работаете с одной сущностью — **заявкой** на депозит. У неё два поля состояния и больше ничего.

    - **`status`** — исход. Ровно три значения, других не будет: `PENDING` — идёт, `SUCCESS` — деньги
      получены, `FAILED` — не получены. Вся денежная логика строится только на нём.
    - **`stage`** — этап жизненного цикла: что с заявкой происходит сейчас или чем она кончилась.
      Это действие, поэтому названия глагольные, и форма слова говорит о завершённости:
      **`-ING` — процесс идёт, `-ED` — процесс кончился.**

    ```
    status    stage                                      что это значит

    PENDING   ISSUING_REQUISITES  ──┐                    платёжная система готовит `redirect_url` / реквизиты — заберите их GET-статусом
              AWAITING_PAYMENT    ──┤                    ждём оплату клиента
              AWAITING_CODE       ──┤ идёт               ждём подтверждение от клиента
              VERIFYING           ──┤                    проверяем платёж
              DISPUTING           ──┤                    разбираем спор
              CANCELING           ──┘                    отменяем по вашему запросу

    SUCCESS   SETTLED                                    оплачена и зачислена

    FAILED    EXPIRED                                    срок жизни истёк — клиент не оплатил вовремя
              CANCELED                                   отменена по вашему POST /cancel
              REJECTED                                   отклонена
              UNROUTED                                   ни одна платёжная система не выдала реквизиты
              REVERSED                                   деньги отозваны (см. «Возврат»)
              ERRORED                                    техническая ошибка
    ```

    Переходы состояний:

    ```
     создание
        │
        ▼
    ┌──────────────────────────────────────────────┐
    │ PENDING                                      │
    │ ISSUING_REQUISITES · AWAITING_PAYMENT ·      │
    │ AWAITING_CODE · VERIFYING · DISPUTING        │
    │     │ POST /cancel (если этап допускает)     │
    │     ▼                                        │
    │ CANCELING                                    │
    └───────┬──────────────────────────┬───────────┘
            │ оплата подтверждена      │ неуспех
            ▼                          ▼
    ┌───────────────┐  возврат → REVERSED  ┌───────────────────────┐
    │ SUCCESS       ├─────────────────────►│ FAILED                │
    │ SETTLED       │                      │ EXPIRED · CANCELED ·  │
    │               │◄─────────────────────┤ REJECTED · UNROUTED · │
    └───────────────┘ апелляция → SETTLED  │ REVERSED · ERRORED    │
                                           └───────────────────────┘
    ```

    Диаграмма намеренно не задаёт порядок этапов внутри `PENDING`: этапы могут идти в любом
    порядке и пропускаться, исход может наступить с любого этапа.

    Правила обработки:

    - Ветвитесь по `status`. `stage` — для отображения клиенту, разбора инцидентов и аналитики.
    - Заявка всегда рождается в `PENDING`; исход (`SUCCESS` или `FAILED`) может наступить
      с любого этапа.
    - Порядок этапов не гарантируется: их набор и последовательность зависят от метода
      и платёжной системы, этапы могут пропускаться. Не стройте автомат на переходах `stage` —
      единственная опора это текущая пара `status` + `stage`.
    - Внутри `PENDING` этап меняется без колбэков — актуальное значение показывает
      только `GET /v1/deposits/{transaction_id}`. Колбэк приходит на смену исхода.
    - Незнакомый `stage` — заявка остаётся в своём `status`, ждите следующего колбэка.
      Новые этапы появляются без смены версии API; новых значений `status` не появится.
    - Зачисляйте `paid_amount` — фактически оплаченную сумму. Сравнивайте её с той суммой,
      которую клиент был должен: это `pay_amount`, а если его в ответе нет — `amount`.
      Расхождение означает недоплату или переплату; отдельных статусов и этапов для этого нет,
      это арифметика.

    > ↓ Ошибки запроса — не статусы заявки: «Ошибки запроса» ниже.

    ## Колбэки

    При смене исхода заявки Сервис делает `POST` на ваш `callback_url`. Тело — ровно пять полей:
    `occurred_at`, `order_id`, `transaction_id`, `status`, `stage`. Сумм и реквизитов в нём нет:
    колбэк — сигнал «состояние изменилось», деньги смотрите в `GET /v1/deposits/{transaction_id}`.

    - Подписан той же схемой (`x-api-key`, `x-signature` от сырого тела) — проверяйте подпись до обработки.
    - Доставка at-least-once, порядок не гарантируется: дедуплицируйте по паре `transaction_id` + `occurred_at`. Обработчик должен быть идемпотентным: повторный колбэк с той же парой не должен приводить к повторному зачислению или повторной бизнес-реакции.
    - Промежуточные этапы внутри `PENDING` колбэками не сопровождаются; возврат и апелляция — сопровождаются.
    - В песочнице колбэки не доставляются: мок отвечает на входящие запросы и исходящих не делает.
    - Приёмник: только `https`, публичный адрес, порт 443; успешный приём — `HTTP 200`,
      редирект считается недоставкой. При недоставке — повторы с нарастающими интервалами.

    ## Отмена мерчантом

    Заявку в `PENDING` можно отменить: `POST /v1/deposits/{transaction_id}/cancel` — тело пустое,
    подпись от пустой строки, как у GET. Отмена — просьба, а не гарантия: она конкурирует с оплатой клиента.

    - Приняли — `202`, заявка переходит в `stage = CANCELING` (статус остаётся `PENDING`);
      повтор запроса в этом состоянии безопасен и снова вернёт `202`.
    - Исход придёт колбэком: обычно `FAILED / CANCELED`; если клиент успел оплатить — `SUCCESS / SETTLED`.
      Деньги, как всегда, подтверждает `GET /v1/deposits/{transaction_id}`.
    - Заявку в исходе отменить нельзя — `409 ALREADY_FINALIZED`; на этапах, где платёж уже
      в обработке (`VERIFYING`, `DISPUTING`), отмена недоступна — `409 CANCEL_NOT_AVAILABLE`.

    ## Возврат и апелляция

    Заявка **не закрывается навсегда** — над ней может быть совершено действие после исхода:

    - **возврат** (chargeback): `SUCCESS → FAILED`, `stage = REVERSED`, в ответе появляется блок
      `reversal` с деталями. Возврат всегда полный — сторнируйте `paid_amount` целиком;
    - **апелляция**: `FAILED → SUCCESS`, `stage = SETTLED`.

    У переходов разный инициатор — важно не путать, что запускаете вы, а что происходит само:

    | Переход | Инициатор | Как запускается / как узнаёте |
    |---|---|---|
    | Отмена: `PENDING`, `stage → CANCELING` | вы | `POST /v1/deposits/{transaction_id}/cancel` — см. «Отмена мерчантом» |
    | Возврат: `SUCCESS → FAILED` (`REVERSED`) | платёжная система | ручки нет — узнаёте из колбэка |
    | Апелляция: `FAILED → SUCCESS` (`SETTLED`) | Сервис / платёжная система | ручки нет — узнаёте из колбэка |

    `GET /v1/deposits/{transaction_id}` после перехода немедленно отражает новое состояние.

    Каждое такое изменение сопровождается новым колбэком. Не переставайте слушать колбэки
    после исхода — именно на этом ломаются интеграции.

    ## Лимиты

    Лимиты запросов и сумм согласуются при подключении. `429 RATE_LIMIT_EXCEEDED` приходит с заголовком
    `Retry-After`; сумма вне диапазона → `422 AMOUNT_OUT_OF_RANGE` (границы в ответе не сообщаются).

    ## Ошибки запроса

    Не называйте одним словом два разных явления:

    | | Ошибка запроса | Заявка не удалась |
    |---|---|---|
    | HTTP-код | `4xx` / `5xx` | `200` |
    | Тело | объект `error` | `status: "FAILED"` + `stage` (+ `error.message`) |
    | Что случилось | запрос не выполнен: заявка не создана, статус не отдан, отмена не принята | запрос выполнен, деньги не получены — исход заявки, а не сбой API |
    | Ваша реакция | исправить запрос или повторить по таблице ниже | ветвиться по `status`; ретраить запрос бессмысленно |

    Ошибка приходит объектом `error`: `reason` — машиночитаемый код, **ветвитесь по нему**;
    `code` — числовой, опорой служить не должен; `message` — пояснение для разработчика.

    | HTTP | `reason` | Ручки | что делать |
    |---|---|---|---|
    | 400 | `VALIDATION_ERROR`, `METHOD_NOT_ALLOWED_VALUE`, `BANK_UNKNOWN`, `BANK_NOT_SUPPORTED_FOR_METHOD`, `CURRENCY_NOT_SUPPORTED` | создание | исправить запрос; повтор без изменений бесполезен |
    | 401 | `INVALID_SIGNATURE`, `UNKNOWN_API_KEY` | все | проверить ключ и расчёт подписи |
    | 404 | `TRANSACTION_NOT_FOUND` | статус, отмена | проверить `transaction_id`; чужие заявки не видны |
    | 409 | `DUPLICATE_ORDER_ID` | создание | `order_id` уже использован с другим телом — новая попытка оплаты требует нового `order_id` |
    | 409 | `ALREADY_FINALIZED`, `CANCEL_NOT_AVAILABLE` | отмена | заявка уже в исходе — смотрите GET / текущий этап не допускает отмену |
    | 422 | `METHOD_TEMPORARILY_UNAVAILABLE`, `AMOUNT_OUT_OF_RANGE`, `PSP_NOT_FOUND`, `PSP_DISABLED`, `FLOW_NOT_ALLOWED` | создание | заявка не создана: маршрут — повторить позже, сумма — исправить; вариант интеграции недоступен вашему подключению — согласуйте его включение с поддержкой |
    | 429 | `RATE_LIMIT_EXCEEDED` | все | повторить не раньше `Retry-After` |
    | 500 | `INTERNAL_ERROR` | все | повторить с тем же `order_id` |
    | 502 | `SERVICE_TEMPORARILY_UNAVAILABLE` | создание | состояние не определено: повторить с тем же `order_id` и тем же телом |

    Неуспех самой заявки ошибкой запроса **не является**: он описывается парой `status` + `stage`,
    а блок `error` в статусе заявки несёт только человекочитаемое `message` и разбору не подлежит.

    ## Общие принципы и форматы

    - HTTPS, TLS ≥ 1.2; тела — JSON в UTF-8, `content-type: application/json`.
    - Имена полей — `snake_case`; словарные значения — UPPERCASE (`PENDING`, `SUCCESS`, …).
    - Даты — ISO 8601 в UTC: `2026-07-17T14:35:45Z`.
    - Суммы — number, не более 2 знаков после запятой. Валюта — ISO 4217, сейчас только `RUB`.
    - Поля со значением `null` в тела не включаются.
    - Незнакомые поля и новые значения словарей (`stage`, `reason`) игнорируйте — они появляются без смены версии API.

    ## Версионирование

    Версия в пути (`/v1`). Без смены версии появляются новые необязательные поля, значения словарей, банки и PSP.
    Ломающие изменения — только как `/v2`. Устаревание анонсируется заголовками `Deprecation` и `Sunset`.

    ## Трассировка и поддержка

    Передавайте `x-request-id` (иначе Сервис сгенерирует его сам; в обоих случаях он возвращается в ответе) и логируйте его.
    В поддержку сообщайте `transaction_id`, `occurred_at` колбэка и `x-request-id`.

    ## Песочница

    Попробовать API можно без своего окружения:

    - публичная дока с интерактивной песочницей: https://documenter.getpostman.com/view/56707679/2sBY4PPLTt
    - мок-сервер для собственных curl-запросов: `https://a58fd3b3-5266-4501-beff-14ad901aa5c7.mock.pstmn.io`
    - коллекция со скриптами подписи, тестами и сценарными папками — форк: https://god.gw.postman.com/run-collection/56707679-4659f419-e950-42d3-8933-ddc79316c3d7

    Мок реальных денег не двигает и подпись не проверяет; сценарии выбираются заголовками
    запроса — полная справка: https://swbw.mintlify.app/api-reference/sandbox-reference
servers:
  - url: "https://{host}"
    description: Хост API сообщается при подключении
    variables:
      host:
        default: api.example
        description: Домен Сервиса; выдаётся при подключении вместе с ключами.
security:
  - ApiKeyAuth: []
    SignatureAuth: []
tags:
  - name: Депозиты
    description: Создание депозита и получение его статуса.
paths:
  /v1/deposits:
    post:
      tags: [Депозиты]
      operationId: createDeposit
      summary: Создать депозит
      description: |
        Создаёт заявку на приём платежа. Ответ един для обоих вариантов интеграции:
        подтверждение создания (`transaction_id`, `status = PENDING`, `stage = ISSUING_REQUISITES`),
        без `redirect_url` и без `requisites`. Артефакт вашего варианта заберите запросом
        `GET /v1/deposits/{transaction_id}`: в `redirect` — `redirect_url` (форма для оплаты),
        в `h2h` — платёжные `requisites` и `pay_amount`.

        - Идемпотентность — по `order_id`: повтор с тем же телом безопасен и вернёт тот же депозит.
        - При `422 METHOD_TEMPORARILY_UNAVAILABLE` депозит не создан — повторите позже.
        - При `502 SERVICE_TEMPORARILY_UNAVAILABLE` состояние не определено — повторите с тем же
          `order_id` и байт-в-байт тем же телом.

        Обязательные заголовки: `x-api-key`, `x-signature` (HMAC-SHA256 от сырого тела),
        `content-type: application/json`. Необязательный `x-request-id` — для сквозной трассировки.

        Маршрут по умолчанию выбирает Сервис по `method`, `bank` и вашим настройкам подключения.
        Если за вами закреплена конкретная платёжная система — передайте её slug необязательным
        полем `psp` в теле запроса (`"psp": "psp-slug"`; значения выдаются при подключении).
        Неизвестный или отключённый slug — `422 PSP_NOT_FOUND` / `PSP_DISABLED`.

        ### Поля запроса

        | Поле | Тип | Обязательное | Описание |
        |---|---|---|---|
        | `order_id` | string | **да** | ID транзакции в вашей системе; ключ идемпотентности, уникален бессрочно |
        | `amount` | number | **да** | сумма, строго больше нуля, не более 2 знаков после запятой |
        | `currency` | string | **да** | ISO 4217; сейчас только `RUB` |
        | `method` | string | **да** | метод оплаты: `sbp` — СБП, по номеру телефона \| `nspk` — НСПК, по QR-коду / платёжной ссылке \| `transgran` — трансграничный перевод \| `c2c` — по номеру карты |
        | `flow` | string | **да** | вариант интеграции: `redirect` \| `h2h` |
        | `callback_url` | string (uri) | **да** | HTTPS-приёмник колбэков; публичный адрес, порт 443 |
        | `success_url` | string (uri) | да (redirect) / — (h2h) | возврат клиента при успешной оплате |
        | `pending_url` | string (uri) | да (redirect) / — (h2h) | возврат клиента, пока оплата не подтверждена |
        | `fail_url` | string (uri) | да (redirect) / — (h2h) | возврат клиента при неуспехе |
        | `psp` | string | нет | slug платёжной системы при закреплённом за вами маршруте; без него маршрут выбирает Сервис. Неверный slug — `422 PSP_NOT_FOUND` / `PSP_DISABLED`. Кто фактически выдал реквизиты — поле `psp` в GET-статусе, оно появляется после выдачи |
        | `bank` | string | нет | банк клиента — тот, который клиент выбрал у вас при оплате (`sber`, `tbank`, `alfa`, …): Сервис выдаст реквизиты в этом банке при наличии; не передан — банк выбирает Сервис |
        | `customer_account_id` | integer | нет | числовой ID клиента в вашей системе |
        | `fields` | object | нет | данные плательщика: `first_name`, `last_name`, `middle_name`, `email`, `phone` — все необязательны |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositCreateRequest"
            example:
              order_id: "ORDER-1001"
              amount: 1500.00
              currency: "RUB"
              method: "sbp"
              flow: "redirect"
              psp: "psp-slug"
              bank: "tbank"
              customer_account_id: 778234
              callback_url: "https://merchant.example/payments/callback"
              success_url: "https://merchant.example/payments/success"
              pending_url: "https://merchant.example/payments/pending"
              fail_url: "https://merchant.example/payments/fail"
              fields:
                first_name: "Иван"
                last_name: "Петров"
                phone: "+79161234567"
      responses:
        "200":
          description: Депозит создан (или возвращён ранее созданный — идемпотентный повтор).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositCreateResponse"
              examples:
                created:
                  summary: Заявка создана — артефакт варианта придёт в GET-статусе
                  value:
                    transaction_id: "9f3c2a71-0d6e-4c1b-8a52-3f9e12ab34cd"
                    order_id: "ORDER-1001"
                    status: "PENDING"
                    stage: "ISSUING_REQUISITES"
                    amount: 1500.00
                    currency: "RUB"
                    expires_at: "2026-07-17T14:45:45Z"
        "400":
          description: "Ошибка валидации: `VALIDATION_ERROR`, `METHOD_NOT_ALLOWED_VALUE`, `BANK_UNKNOWN`, `BANK_NOT_SUPPORTED_FOR_METHOD`, `CURRENCY_NOT_SUPPORTED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: 4001
                  reason: "METHOD_NOT_ALLOWED_VALUE"
                  message: "method must be one of: sbp, nspk, transgran, c2c"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Повтор `order_id` с изменённым телом.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: 4090
                  reason: "DUPLICATE_ORDER_ID"
                  message: "order_id already used with a different body"
        "422":
          description: |
            Заявка не создана, `transaction_id` не выдан:
            - `METHOD_TEMPORARILY_UNAVAILABLE` — под запрошенные `method` и `bank` сейчас нет живого маршрута; повторите позже;
            - `AMOUNT_OUT_OF_RANGE` — сумма вне допустимого диапазона;
            - `PSP_NOT_FOUND`, `PSP_DISABLED` — только если вы передали поле `psp`: slug не найден либо система отключена.
            - `FLOW_NOT_ALLOWED` — запрошенный `flow` недоступен вашему подключению.

            Отличайте от `stage = UNROUTED`: там заявка **создана**, `transaction_id` выдан,
            но ни одна платёжная система не выдала реквизиты — исход `FAILED`, о нём приходит колбэк.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: 4220
                  reason: "METHOD_TEMPORARILY_UNAVAILABLE"
                  message: "no available route for the requested method and bank, retry later"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: Временная недоступность; состояние депозита не определено — повторите позже с тем же `order_id` и тем же телом.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: 5020
                  reason: "SERVICE_TEMPORARILY_UNAVAILABLE"
                  message: "service temporarily unavailable, retry later"
      callbacks:
        statusChanged:
          "{$request.body#/callback_url}":
            post:
              summary: Колбэк о смене статуса депозита
              description: |
                `POST` на ваш `callback_url` при переходе заявки в `SUCCESS`/`FAILED`
                и при каждом пересмотре исхода (возврат, апелляция). Промежуточные этапы
                внутри `PENDING` колбэками не сопровождаются.

                - Подписан той же схемой (`x-api-key`, `x-signature` — HMAC-SHA256 от сырого тела);
                  проверяйте подпись до обработки.
                - Доставка at-least-once: дедуплицируйте по паре `transaction_id` + `occurred_at`. Обработчик должен быть идемпотентным: повторный колбэк с той же парой не должен приводить к повторному зачислению или повторной бизнес-реакции.
                - Порядок доставки не гарантируется — ориентируйтесь на `occurred_at` и данные GET.
                - Суммы, реквизиты и `psp` в колбэк не включаются — после колбэка запросите
                  `GET /v1/deposits/{transaction_id}`.

                Требования к приёмнику: только `https`, публичный адрес, порт 443; успешный приём —
                `HTTP 200` в течение ограниченного времени; редиректы считаются недоставкой.
                При недоставке — повторы с нарастающими интервалами.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/CallbackEvent"
                    example:
                      occurred_at: "2026-07-17T14:41:02.123Z"
                      order_id: "ORDER-1001"
                      transaction_id: "9f3c2a71-0d6e-4c1b-8a52-3f9e12ab34cd"
                      status: "SUCCESS"
                      stage: "SETTLED"
              responses:
                "200":
                  description: Колбэк принят. Любой другой код, таймаут или редирект — недоставка, будет повтор.
  /v1/deposits/{transaction_id}:
    get:
      tags: [Депозиты]
      operationId: getDepositStatus
      summary: Статус депозита
      description: |
        Возвращает текущее состояние депозита — **источник истины о статусе**.
        Успешный запрос возвращает `200`, в том числе пока оплата не завершена (`status = PENDING`);
        ошибки — см. ответы `401`, `404`, `429`, `500`.

        Подпись GET-запроса считается от пустой строки: `x-signature = hex(HMAC_SHA256(secret_key, ""))`.

        Блок `requisites` (состав зависит от `method`): в варианте интеграции redirect — справочная
        маскированная копия, платить по ней не нужно — полные реквизиты клиент видит на форме
        для оплаты; в h2h — платёжные, полные: клиент переводит именно по ним.

        Зачисляйте клиенту `paid_amount` — фактически оплаченную сумму. Сравнивайте её с суммой
        к оплате: `pay_amount`, а если его в ответе нет — `amount`. Расхождение означает недоплату
        или переплату; отдельного статуса или этапа для этого нет.

        ### Поля ответа

        | Поле | Тип | Когда присутствует | Описание |
        |---|---|---|---|
        | `order_id`, `transaction_id` | string | всегда | ваш ID и ID депозита в Сервисе |
        | `status` | string | всегда | исход: `PENDING` \| `SUCCESS` \| `FAILED` — единственное поле для денежной логики |
        | `stage` | string | всегда | этап жизненного цикла (`-ING` идёт, `-ED` кончился); словарь пополняется без смены версии |
        | `method` | string | всегда | платёжный метод: `sbp` \| `nspk` \| `transgran` \| `c2c` |
        | `amount` | number | всегда | заявленная вами сумма |
        | `currency` | string | всегда | `RUB` |
        | `bank` | string | если применимо | код банка выданного реквизита |
        | `psp` | string | после выдачи реквизитов | slug платёжной системы, **фактически выдавшей реквизиты**; до выдачи отсутствует — даже если вы передали `psp` при создании |
        | `pay_amount` | number | если отличается от `amount` | сумма к оплате — клиент должен оплатить именно её |
        | `redirect_url` | string (uri) | redirect: когда форма готова | форма для оплаты — направьте на неё клиента |
        | `paid_amount` | number | как только платёж получен | фактически оплаченная сумма — зачисляйте её |
        | `requisites` | object | после выдачи реквизитов, пока заявка ждёт оплату; в исходе сохраняются только при истечении (`EXPIRED`) | redirect — справочная маскированная копия; h2h — платёжные, полные |
        | `reversal` | object | после возврата | `occurred_at`, `amount` (= `paid_amount`), `reason`; остаётся навсегда |
        | `error` | object | при `status = FAILED` | только `message` — человекочитаемое пояснение, разбору не подлежит |
        | `account_number`, `destination_account_number` | string | если применимо | маскированные реквизиты плательщика/получателя |
        | `created_at`, `updated_at`, `expires_at`, `paid_at` | date-time | по мере наступления | временные метки |
      parameters:
        - name: transaction_id
          in: path
          required: true
          description: ID депозита в Сервисе (UUID из ответа создания депозита).
          schema:
            type: string
            format: uuid
          example: "9f3c2a71-0d6e-4c1b-8a52-3f9e12ab34cd"
      responses:
        "200":
          description: Текущее состояние депозита.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositStatusResponse"
              examples:
                issuing:
                  summary: Реквизиты подбираются — поля `psp` ещё нет
                  description: |
                    Заявка создана с `psp: "psp-slug"` в запросе, но реквизиты ещё не выданы —
                    поля `psp` в ответе нет. Оно придёт вместе с реквизитами и при закреплённом
                    маршруте совпадёт с закреплённым slug.
                  value:
                    order_id: "ORDER-1003"
                    transaction_id: "7c1e9b48-3a25-4f60-b7d1-6e0a5c8d92f3"
                    status: "PENDING"
                    stage: "ISSUING_REQUISITES"
                    method: "sbp"
                    amount: 1500.00
                    currency: "RUB"
                    created_at: "2026-07-17T14:35:45Z"
                    updated_at: "2026-07-17T14:35:45Z"
                    expires_at: "2026-07-17T14:45:45Z"
                pending:
                  summary: Ожидание оплаты (sbp)
                  value:
                    order_id: "ORDER-1001"
                    transaction_id: "9f3c2a71-0d6e-4c1b-8a52-3f9e12ab34cd"
                    status: "PENDING"
                    stage: "AWAITING_PAYMENT"
                    method: "sbp"
                    bank: "tbank"
                    psp: "psp-slug"
                    redirect_url: "https://pay.example/p/ab12cd34ef56"
                    amount: 1500.00
                    pay_amount: 1500.37
                    currency: "RUB"
                    requisites:
                      phone: "+7926***6543"
                      bank: "tbank"
                      bank_name: "Т-Банк"
                      recipient_name: "Пётр С."
                    created_at: "2026-07-17T14:35:45Z"
                    updated_at: "2026-07-17T14:35:47Z"
                    expires_at: "2026-07-17T14:45:45Z"
                success:
                  summary: Успех
                  value:
                    order_id: "ORDER-1001"
                    transaction_id: "9f3c2a71-0d6e-4c1b-8a52-3f9e12ab34cd"
                    status: "SUCCESS"
                    stage: "SETTLED"
                    method: "sbp"
                    bank: "tbank"
                    psp: "psp-slug"
                    amount: 1500.00
                    pay_amount: 1500.37
                    paid_amount: 1500.37
                    currency: "RUB"
                    created_at: "2026-07-17T14:35:45Z"
                    updated_at: "2026-07-17T14:41:02Z"
                    paid_at: "2026-07-17T14:40:58Z"
                failed:
                  summary: Неуспех (истёк срок)
                  value:
                    order_id: "ORDER-1002"
                    transaction_id: "5b8d1f02-77aa-4e3c-9c40-b1e2d3f4a5c6"
                    status: "FAILED"
                    stage: "EXPIRED"
                    method: "c2c"
                    bank: "tbank"
                    psp: "psp-slug"
                    amount: 2000.00
                    currency: "RUB"
                    requisites:
                      card_number: "411111******1111"
                      bank: "tbank"
                      bank_name: "Т-Банк"
                      recipient_name: "Пётр С."
                    error:
                      message: "Клиент не оплатил заявку до истечения срока"
                    created_at: "2026-07-17T13:00:00Z"
                    updated_at: "2026-07-17T13:12:00Z"
                    expires_at: "2026-07-17T13:10:00Z"
                reversed:
                  summary: Возврат по ранее успешной заявке (chargeback)
                  value:
                    order_id: "ORDER-1001"
                    transaction_id: "9f3c2a71-0d6e-4c1b-8a52-3f9e12ab34cd"
                    status: "FAILED"
                    stage: "REVERSED"
                    method: "sbp"
                    bank: "tbank"
                    psp: "psp-slug"
                    amount: 1500.00
                    pay_amount: 1500.37
                    paid_amount: 1500.37
                    currency: "RUB"
                    reversal:
                      occurred_at: "2026-07-31T09:12:00Z"
                      amount: 1500.37
                      reason: "DISPUTE_LOST"
                    created_at: "2026-07-17T14:35:45Z"
                    updated_at: "2026-07-31T09:12:00Z"
                    paid_at: "2026-07-17T14:40:58Z"
                appealed:
                  summary: Успех после апелляции — блок `reversal` остался
                  description: |
                    Возврат был, затем апелляция выиграна: исход снова `SUCCESS / SETTLED`,
                    а блок `reversal` остался — он часть истории заявки. Признак действующего
                    возврата — не присутствие блока, а текущий `FAILED / REVERSED`.
                  value:
                    order_id: "ORDER-1001"
                    transaction_id: "9f3c2a71-0d6e-4c1b-8a52-3f9e12ab34cd"
                    status: "SUCCESS"
                    stage: "SETTLED"
                    method: "sbp"
                    bank: "tbank"
                    psp: "psp-slug"
                    amount: 1500.00
                    pay_amount: 1500.37
                    paid_amount: 1500.37
                    currency: "RUB"
                    reversal:
                      occurred_at: "2026-07-31T09:12:00Z"
                      amount: 1500.37
                      reason: "DISPUTE_LOST"
                    created_at: "2026-07-17T14:35:45Z"
                    updated_at: "2026-08-02T10:05:00Z"
                    paid_at: "2026-07-17T14:40:58Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Транзакция не найдена в вашем аккаунте (в т.ч. создана другим мерчантом).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: 4040
                  reason: "TRANSACTION_NOT_FOUND"
                  message: "transaction not found"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/deposits/{transaction_id}/cancel:
    post:
      tags: [Депозиты]
      operationId: cancelDeposit
      summary: Отменить депозит
      description: |
        Просьба отменить заявку, пока она в `PENDING`. Тело запроса пустое; подпись считается
        от пустой строки: `x-signature = hex(HMAC_SHA256(secret_key, ""))`.

        Отмена конкурирует с оплатой: `202` означает «принято», а не «отменено». Заявка
        переходит в `stage = CANCELING`; исход придёт колбэком — `FAILED / CANCELED`, либо
        `SUCCESS / SETTLED`, если клиент успел оплатить. Повтор запроса, пока идёт отмена,
        безопасен и возвращает `202` с тем же снапшотом.
      parameters:
        - name: transaction_id
          in: path
          required: true
          description: ID депозита в Сервисе (UUID из ответа создания депозита).
          schema:
            type: string
            format: uuid
          example: "9f3c2a71-0d6e-4c1b-8a52-3f9e12ab34cd"
      responses:
        "202":
          description: Отмена принята, идёт обработка. Снапшот заявки — `stage = CANCELING`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositStatusResponse"
              example:
                order_id: "ORDER-1001"
                transaction_id: "9f3c2a71-0d6e-4c1b-8a52-3f9e12ab34cd"
                status: "PENDING"
                stage: "CANCELING"
                method: "sbp"
                bank: "tbank"
                psp: "psp-slug"
                amount: 1500.00
                pay_amount: 1500.37
                currency: "RUB"
                created_at: "2026-07-17T14:35:45Z"
                updated_at: "2026-07-17T14:37:10Z"
                expires_at: "2026-07-17T14:45:45Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Транзакция не найдена в вашем аккаунте (в т.ч. создана другим мерчантом).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: 4040
                  reason: "TRANSACTION_NOT_FOUND"
                  message: "transaction not found"
        "409":
          description: |
            Отмена невозможна:
            - `ALREADY_FINALIZED` — заявка уже в исходе; текущее состояние — `GET /v1/deposits/{transaction_id}`;
            - `CANCEL_NOT_AVAILABLE` — текущий этап не допускает отмену (платёж уже в обработке).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: 4091
                  reason: "ALREADY_FINALIZED"
                  message: "deposit already finalized, check current state via GET"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Публичный ключ аккаунта мерчанта; выдаётся при подключении.
    SignatureAuth:
      type: apiKey
      in: header
      name: x-signature
      description: |
        HMAC-SHA256 от сырого тела запроса (`hex`, нижний регистр), секрет — `secret_key`.
        Для GET — от пустой строки `""`. Механика и примеры:
        https://swbw.mintlify.app/api-reference/authentication («Аутентификация и подпись»).
  responses:
    Unauthorized:
      description: "`INVALID_SIGNATURE` — подпись невалидна; `UNKNOWN_API_KEY` — ключ не найден или отозван."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: 4010
              reason: "INVALID_SIGNATURE"
              message: "signature mismatch"
    RateLimited:
      description: Превышен лимит запросов. Повторите не раньше времени из заголовка `Retry-After`.
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить запрос.
          schema:
            type: string
          example: "30"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: 4290
              reason: "RATE_LIMIT_EXCEEDED"
              message: "rate limit exceeded"
    InternalError:
      description: Внутренняя ошибка Сервиса.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: 5000
              reason: "INTERNAL_ERROR"
              message: "internal error"
  schemas:
    PaymentMethod:
      type: string
      enum: [sbp, nspk, transgran, c2c]
      description: |
        Платёжный метод:
        - `sbp` — СБП, перевод по номеру телефона
        - `nspk` — НСПК, оплата по QR-коду / платёжной ссылке
        - `transgran` — трансграничный перевод по выданным реквизитам с инструкцией
        - `c2c` — перевод по номеру карты
      example: sbp
    BankCode:
      type: string
      description: "Код (slug) банка из справочника: `sber` — Сбербанк, `tbank` — Т-Банк, `alfa` — Альфа-Банк. Актуальный перечень сообщается при подключении."
      example: tbank
    DepositCreateRequest:
      type: object
      required: [order_id, amount, currency, method, flow, callback_url]
      properties:
        order_id:
          type: string
          description: ID транзакции в вашей системе; ключ идемпотентности. Уникален в рамках аккаунта, бессрочно.
          example: "ORDER-1001"
        amount:
          type: number
          exclusiveMinimum: 0
          # multipleOf: 0.01 намеренно НЕ используется: на IEEE-754 проверка даёт
          # ложные отказы для валидных сумм (1234.56, 19.99 — не «кратны» 0.01
          # в двоичной плавающей точке). Ограничение «не более 2 знаков» —
          # контрактное, проверяется на стороне Сервиса, не схемой.
          description: Сумма, строго больше нуля; не более 2 знаков после запятой.
          example: 1500.00
        currency:
          type: string
          enum: [RUB]
          description: Валюта, ISO 4217. В текущей версии — только `RUB`.
        method:
          $ref: "#/components/schemas/PaymentMethod"
        flow:
          type: string
          enum: [redirect, h2h]
          description: |
            Вариант интеграции — обязательное поле.
            `redirect` — клиент оплачивает на форме для оплаты по `redirect_url`;
            `h2h` — реквизиты клиенту показываете вы. И `redirect_url`, и `requisites`
            приходят в `GET /v1/deposits/{transaction_id}`, не в ответе создания.
            Вариант интеграции, недоступный вашему подключению, — `422 FLOW_NOT_ALLOWED`.
        psp:
          type: string
          description: |
            Платёжная система, через которую пойдёт платёж, — slug из настроек подключения.
            Поле необязательное: без него маршрут выбирает Сервис по `method`, `bank`
            и вашим настройкам подключения; с ним платёж идёт через указанную систему
            (`422 PSP_NOT_FOUND` / `PSP_DISABLED`, если slug неизвестен или система отключена).
            Значения выдаются при подключении.

            Гарантия закрепления действует с момента создания, ещё до обращения
            к платёжной системе: раз заявка создана (не было `422`) — реквизиты,
            если дойдёт до их выдачи, выдаст именно указанная система. Факт выдачи
            подтверждает поле `psp` в `GET /v1/deposits/{transaction_id}`: оно
            появляется вместе с выданными реквизитами и при закреплённом маршруте
            совпадает с закреплённым slug; до выдачи — и если выдачи не было —
            поля в ответе нет.
          example: "psp-slug"
        bank:
          allOf: [{ $ref: "#/components/schemas/BankCode" }]
          description: |
            Банк клиента — тот, который клиент выбрал у вас при оплате.
            При наличии Сервис выдаст реквизиты в этом банке — клиент
            переводит деньги внутри своего банка. Если не передан —
            банк выбирает Сервис.
        customer_account_id:
          type: integer
          description: Числовой ID клиента в вашей системе.
          example: 778234
        callback_url:
          type: string
          format: uri
          description: HTTPS-URL приёма колбэков; публично доступный, порт 443 (иной — по согласованию).
          example: "https://merchant.example/payments/callback"
        success_url:
          type: string
          format: uri
          description: "Возврат клиента при успешной оплате. Вариант интеграции — redirect: обязательно. В h2h не используется."
        pending_url:
          type: string
          format: uri
          description: "Возврат клиента, пока оплата не подтверждена. Вариант интеграции — redirect: обязательно. В h2h не используется."
        fail_url:
          type: string
          format: uri
          description: "Возврат клиента при неуспехе. Вариант интеграции — redirect: обязательно. В h2h не используется."
        fields:
          $ref: "#/components/schemas/PayerFields"
    PayerFields:
      type: object
      description: Данные плательщика (все поля необязательны).
      properties:
        first_name: { type: string, description: Имя, example: "Иван" }
        last_name: { type: string, description: Фамилия, example: "Петров" }
        middle_name: { type: string, description: Отчество }
        email: { type: string, description: Email плательщика }
        phone: { type: string, description: Телефон плательщика, example: "+79161234567" }
    DepositCreateResponse:
      type: object
      description: |
        Ответ создания заявки — единый для обоих вариантов интеграции: подтверждение
        без `redirect_url` и без `requisites`. Артефакт вашего варианта заберите
        запросом `GET /v1/deposits/{transaction_id}`.
      required: [transaction_id, order_id, status, stage]
      properties:
        transaction_id:
          type: string
          format: uuid
          description: ID депозита в Сервисе; используйте в статусных запросах и при обращениях в поддержку.
        order_id:
          type: string
          description: Эхо вашего ID.
        status:
          type: string
          enum: [PENDING]
          description: На создании всегда `PENDING`.
        stage:
          type: string
          enum: [ISSUING_REQUISITES]
          description: |
            На создании — `ISSUING_REQUISITES`: платёжная система готовит артефакт
            вашего варианта интеграции (`redirect_url` или `requisites`) —
            он появится в `GET /v1/deposits/{transaction_id}`.
        amount:
          type: number
          description: Заявленная вами сумма.
        currency:
          type: string
          description: "`RUB`"
        expires_at:
          type: string
          format: date-time
          description: Срок жизни заявки; после истечения — `status = FAILED`, `stage = EXPIRED`.
    DepositStatusResponse:
      type: object
      required: [order_id, transaction_id, status, stage, method, amount, currency]
      properties:
            order_id: { type: string, description: Ваш ID }
            transaction_id: { type: string, format: uuid, description: ID депозита в Сервисе }
            status:
              type: string
              enum: [PENDING, SUCCESS, FAILED]
              description: |
                Исход заявки — единственное поле для денежной логики.
                `PENDING` — идёт, `SUCCESS` — деньги получены, `FAILED` — не получены.
                Других значений не появится.
            stage:
              type: string
              description: |
                Этап жизненного цикла заявки — глагольная форма: `-ING` идёт, `-ED` кончился.
                Словарь пополняется без смены версии; незнакомый этап означает,
                что заявка осталась в своём `status` — ждите следующего колбэка.
                - PENDING: `ISSUING_REQUISITES`, `AWAITING_PAYMENT`, `AWAITING_CODE`, `VERIFYING`, `DISPUTING`, `CANCELING`
                - SUCCESS: `SETTLED`
                - FAILED: `EXPIRED`, `CANCELED`, `REJECTED`, `UNROUTED`, `REVERSED`, `ERRORED`
              example: AWAITING_PAYMENT
            method:
              $ref: "#/components/schemas/PaymentMethod"
            bank:
              allOf: [{ $ref: "#/components/schemas/BankCode" }]
              description: Код банка выданного реквизита, если применимо.
            psp:
              type: string
              description: |
                Платёжная система, **фактически выдавшая реквизиты** по этой заявке — slug
                из того же словаря, что и во входном поле `psp` запроса создания.

                **Есть только при выданных реквизитах.** Поле появляется с момента выдачи;
                пока реквизиты подбирают (`stage = ISSUING_REQUISITES`) и во всех исходах
                без выдачи (`UNROUTED`, истечение или отмена ещё на подборе) его нет — даже
                если вы передали `psp` при создании: значение рождается фактом выдачи, а не
                вашим указанием. При закреплённом маршруте оно совпадает с закреплённым slug.

                **Появившись, не меняется** до конца жизни заявки — включая оплату, истечение,
                отмену и возврат. И это не приглашение к закреплению: поле сообщает, кто выдал
                этот реквизит, а не какую систему можно указать в следующем запросе — она
                может быть уже отключена (`422 PSP_DISABLED`).
              example: "psp-slug"
            amount: { type: number, description: Заявленная вами сумма }
            pay_amount:
              type: number
              description: Сумма к оплате, если отличается от `amount`; клиент должен оплатить именно её.
            paid_amount:
              type: number
              description: |
                Фактически оплаченная сумма — присутствует всегда, как только платёж получен.
                Зачисляйте её. Сравнивайте с суммой к оплате (`pay_amount`, а при его отсутствии —
                `amount`): расхождение означает недоплату или переплату, отдельных статусов
                и этапов для этого нет.
            currency: { type: string, description: "`RUB`" }
            account_number:
              type: string
              description: Реквизит плательщика в маскированном виде (карта — `411111******1111`).
            destination_account_number:
              type: string
              description: Реквизит получателя в маскированном виде.
            redirect_url:
              type: string
              format: uri
              description: |
                Форма для оплаты (вариант интеграции redirect) — направьте на неё клиента.
                Появляется, когда форма готова (`stage = AWAITING_PAYMENT`); в h2h не используется.
            requisites:
              $ref: "#/components/schemas/Requisites"
            reversal:
              $ref: "#/components/schemas/Reversal"
            error:
              $ref: "#/components/schemas/FailureNote"
            created_at: { type: string, format: date-time, description: Создание }
            updated_at: { type: string, format: date-time, description: Последнее изменение }
            expires_at: { type: string, format: date-time, description: Срок жизни заявки }
            paid_at: { type: string, format: date-time, description: Время оплаты }
    FailureNote:
      type: object
      description: |
        Появляется только при `status = FAILED` — человекочитаемое пояснение, почему заявка не состоялась.
        Машинная логика строится на паре `status` + `stage`; причина неуспеха здесь не дублируется
        машинным кодом и разбору не подлежит. Коды ошибок запроса — это другой объект (`ErrorObject`).
      required: [message]
      properties:
        message:
          type: string
          description: Пояснение на русском языке; текст может меняться, не завязывайтесь на него.
          example: "Клиент не оплатил заявку до истечения срока"
    Reversal:
      type: object
      description: |
        Возврат средств по ранее успешной заявке (chargeback) — действие над заявкой,
        а не её состояние. Блок появляется вместе с переходом `SUCCESS → FAILED`
        и `stage = REVERSED` и остаётся в ответе навсегда.
      required: [occurred_at, amount]
      properties:
        occurred_at:
          type: string
          format: date-time
          description: Время возврата.
        amount:
          type: number
          description: Возвращённая сумма — всегда равна `paid_amount`, возврат полный. Сторнируйте её целиком.
        reason:
          type: string
          description: Причина возврата, если известна от платёжной системы.
          example: "DISPUTE_LOST"
    Requisites:
      type: object
      description: |
        Реквизиты платежа. Семантика зависит от варианта интеграции:
        - **h2h** — платёжные: приходят в `GET`-статусе, клиент переводит по ним;
        - **redirect** — в GET лежит справочная маскированная копия: полные реквизиты клиент
          видит на форме для оплаты, платить по данным блока не нужно.
        Полные реквизиты в h2h живут не дольше заявки: после истечения срока GET возвращает
        те же поля маской (карта — `411111******1111`, телефон — `+7926***6543`) —
        платить по ним уже нельзя. Маска карты — первые 6 и последние 4 цифры
        (формат PCI DSS). Полные реквизиты Сервис не хранит дольше срока жизни заявки —
        маска остаётся единственным следом.
        Состав по методам:

        | Метод | Поля | Особенность |
        |---|---|---|
        | `sbp` | `phone`, `bank`, `bank_name`, `recipient_name` | перевод по телефону; `bank` — информационный |
        | `c2c` | `card_number`, `bank`, `bank_name`, `recipient_name` | перевод по номеру карты |
        | `nspk` | `payment_url`, `qr_data`, `qr_image_url` | QR рендерите сами из `qr_data` или берите готовую картинку `qr_image_url` |
        | `transgran` | `card_number` или `phone`, `bank_name`, `payment_currency`, `instruction` | `instruction` присутствует всегда — покажите клиенту целиком |
      properties:
        phone: { type: string, description: "Телефон для перевода (`sbp`, `transgran`); в redirect-GET — маскирован", example: "+7926***6543" }
        card_number: { type: string, description: "Номер карты (`c2c`, `transgran`); в redirect-GET — маскирован", example: "411111******1111" }
        bank: { type: string, description: Код банка реквизита }
        bank_name: { type: string, description: Название банка реквизита, example: "Т-Банк" }
        recipient_name: { type: string, description: Имя получателя перевода, example: "Пётр С." }
        payment_url: { type: string, description: "Платёжная ссылка / QR НСПК (`nspk`)" }
        qr_data: { type: string, description: "Данные QR-кода (`nspk`, необязательное)" }
        payment_currency: { type: string, description: "Валюта оплаты по реквизиту (`transgran`)" }
        instruction: { type: string, description: "Текстовая инструкция для клиента (`transgran`). В h2h для `transgran` присутствует всегда — показывайте целиком." }
        qr_image_url: { type: string, format: uri, description: "Готовая картинка QR-кода (`nspk`), если рендер на вашей стороне не нужен" }
    CallbackEvent:
      type: object
      description: |
        Колбэк несёт те же `status` и `stage`, что и `GET /v1/deposits/{transaction_id}` —
        разбирать имя события и достраивать состояние по строке не нужно.
      required: [occurred_at, order_id, transaction_id, status, stage]
      properties:
        occurred_at:
          type: string
          format: date-time
          description: Время события (UTC, с миллисекундами); вместе с `transaction_id` — ключ дедупликации.
          example: "2026-07-17T14:41:02.123Z"
        order_id: { type: string, description: Ваш ID }
        transaction_id: { type: string, format: uuid, description: ID депозита в Сервисе }
        status:
          type: string
          enum: [SUCCESS, FAILED]
          description: Исход заявки на момент события. Промежуточные этапы колбэками не сопровождаются, поэтому `PENDING` здесь не приходит.
        stage:
          type: string
          description: Этап, на котором заявка оказалась. Словарь пополняется — незнакомое значение не мешает обработать `status`.
          example: SETTLED
    ErrorObject:
      type: object
      required: [code, reason, message]
      properties:
        code:
          type: integer
          description: Числовой код. Для причин неуспеха депозита не фиксируется — опорой служить не должен.
        reason:
          type: string
          description: |
            Машиночитаемый код — используйте его в логике обработки. Основные значения:
            `VALIDATION_ERROR` (400), `METHOD_NOT_ALLOWED_VALUE` (400), `BANK_UNKNOWN` (400),
            `BANK_NOT_SUPPORTED_FOR_METHOD` (400), `CURRENCY_NOT_SUPPORTED` (400),
            `INVALID_SIGNATURE` (401), `UNKNOWN_API_KEY` (401), `TRANSACTION_NOT_FOUND` (404),
            `DUPLICATE_ORDER_ID` (409), `ALREADY_FINALIZED` (409), `CANCEL_NOT_AVAILABLE` (409), `METHOD_TEMPORARILY_UNAVAILABLE` (422), `PSP_NOT_FOUND` (422),
            `PSP_DISABLED` (422), `AMOUNT_OUT_OF_RANGE` (422), `FLOW_NOT_ALLOWED` (422), `RATE_LIMIT_EXCEEDED` (429),
            `INTERNAL_ERROR` (500), `SERVICE_TEMPORARILY_UNAVAILABLE` (502).

            Это коды **ошибок запроса**. Неуспех самой заявки описывается парой `status` + `stage`
            и здесь не дублируется — блок `error` в статусе заявки несёт только пояснение.
        message:
          type: string
          description: Пояснение для разработчика.
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorObject"
