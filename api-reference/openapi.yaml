# СГЕНЕРИРОВАННАЯ КОПИЯ — НЕ РЕДАКТИРОВАТЬ.
# Источник правды: contract/openapi.yaml в приватной репе aggr-contract.
# Копия нужна потому, что Mintlify читает спеку только внутри репы доков.
# Обновление: ./scripts/sync-spec.sh (проверка расхождения: --check)
openapi: 3.1.0
info:
  title: Агрегатор — приём депозитов
  version: "1.0"
  contact:
    name: Поддержка Агрегатора
  description: |
    **Основной портал:** https://swbw.mintlify.app — путь заявки, статусы и этапы, суммы и песочница.
    **MCP для подключения документации к ИИ:** `https://swbw.mintlify.app/mcp`.

    API v1 принимает депозиты в `RUB`. Сервис маршрутизирует заявку в платёжную систему и передаёт вам полученный платёжный артефакт. Выплаты в эту версию не входят. Хост боевого API, ключи и списки разрешённых IP выдаются при подключении.

    ## Основной путь

    1. Создайте заявку: `POST /v1/deposits`.
    2. Сохраните полученный `transaction_id`. Ответ создания одинаков для `h2h` и `redirect`: `PENDING / ISSUING_REQUISITES`, без реквизитов и без ссылки на форму для оплаты.
    3. Запрашивайте `GET /v1/deposits/{transaction_id}`, пока не появится артефакт выбранного варианта:
       - `h2h` — `requisites` и `pay_amount`;
       - `redirect` — `redirect_url`.
    4. Покажите клиенту реквизиты либо перенаправьте его на форму для оплаты.
    5. После колбэка снова запросите GET-статус и обработайте итоговый `status`.

    > **Источник истины о состоянии и деньгах — `GET /v1/deposits/{transaction_id}`.**
    > Колбэк — сигнал об изменении состояния, а не носитель финансовых данных.

    ## Выберите вариант интеграции

    |  | `h2h` | `redirect` |
    |---|---|---|
    | Где платит клиент | в вашем интерфейсе по выданным реквизитам | на форме для оплаты |
    | Что приходит в GET-статусе | `requisites` + `pay_amount` | `redirect_url` |
    | Кто показывает реквизиты | вы | форма для оплаты |
    | `success_url` / `pending_url` / `fail_url` | не используются | обязательны |
    | Статусы, колбэки и отмена | общие | общие |

    Подробные пути находятся в папках **«Вариант интеграции h2h»** и **«Вариант интеграции redirectUrl»**.

    ## Где искать информацию

    | Раздел в сайдбаре | Что находится внутри |
    |---|---|
    | Вариант интеграции h2h | правила H2H, реквизиты и исполняемые сценарии |
    | Вариант интеграции redirectUrl | правила Redirect и исполняемые сценарии |
    | Ошибки создания | таблица ошибок, факт создания заявки и готовые негативные примеры |
    | API | подпись, справочники, форматы, версии и механика песочницы |
    | API → Создать депозит | поля запроса, отдельные примеры H2H/Redirect, правила повтора |
    | API → Статус депозита | `status`, `stage`, суммы, реквизиты и колбэки |
    | API → Отменить депозит | отмена, гонка с оплатой, возврат и апелляция |

    ## Попробовать за минуту

    Коллекция подключена к официальному Postman mock-серверу; реальные деньги не перемещаются.

    1. Выберите окружение **«Агрегатор — Sandbox (Mock)»**.
    2. Нажмите **Send** у запроса **«Создать депозит»** — pre-request script рассчитает подпись, а test script сохранит `transaction_id`.
    3. Нажмите **Send** у запроса **«Статус депозита»** — сохранённый ID подставится автоматически.

    Для воспроизведения полного пути нажимайте **Run** на сценарной папке. Заголовки выбора mock-ответов уже настроены. Полная механика мока описана на странице папки **«API»**.
servers:
  - url: "https://{host}"
    description: Хост API сообщается при подключении
    variables:
      host:
        default: api.example
        description: Домен Сервиса; выдаётся при подключении вместе с ключами.
security:
  - ApiKeyAuth: []
    SignatureAuth: []
tags:
  - name: Депозиты
    description: Создание депозита и получение его статуса.
paths:
  /v1/deposits:
    post:
      tags: [Депозиты]
      operationId: createDeposit
      summary: Создать депозит
      description: |
        Создаёт заявку на приём платежа и возвращает её `transaction_id`. Ответ создания одинаков для `h2h` и `redirect`: `status = PENDING`, `stage = ISSUING_REQUISITES`, без реквизитов и без ссылки на форму для оплаты.

        ## Короткий путь

        1. Отправьте `POST /v1/deposits` и сохраните `transaction_id`.
        2. Запрашивайте `GET /v1/deposits/{transaction_id}`, пока не появится артефакт:
           - `h2h` — `requisites` и `pay_amount`;
           - `redirect` — `redirect_url`.
        3. После колбэка снова запросите GET-статус и обработайте итоговый `status`.

        ## Заголовки

        | Заголовок | Обязательный | Назначение |
        |---|---|---|
        | `x-api-key` | **да** | идентификация подключения |
        | `x-signature` | **да** | HMAC-SHA256 от сырого тела |
        | `content-type` | **да** | `application/json` |
        | `x-request-id` | нет | сквозная трассировка; без него Сервис создаст значение сам |

        ## Обязательные поля

        | Поле | Тип | Описание |
        |---|---|---|
        | `order_id` | string | ID транзакции в вашей системе; ключ идемпотентности, уникален бессрочно |
        | `amount` | number | сумма строго больше нуля, не более 2 знаков после запятой |
        | `currency` | string | ISO 4217; сейчас только `RUB` |
        | `method` | string | платёжный метод; полный справочник — в описании папки **«API»** |
        | `flow` | string | `h2h` или `redirect` |
        | `callback_url` | string (uri) | публичный HTTPS-приёмник колбэков, порт 443 |

        ## Маршрутизация — необязательные поля

        | Поле | Тип | Описание |
        |---|---|---|
        | `bank` | string | банк, выбранный пользователем; без поля банк выбирает Сервис |
        | `traffic_type` | string | `ftd` — первый депозит, `std` — повторный по классификации вашей системы; без поля фильтр не применяется |
        | `psp` | string | slug закреплённой платёжной системы; если поле передано, запрос направляется только в указанную PSP, без fallback. Без поля маршрут выбирает Сервис |

        `method`, `bank` и `traffic_type` передаются отдельными полями. Исключения `sber_qr` и `vtb_qr`, банки и типы трафика перечислены в описании папки **«API»**.

        ## Только для `redirect`

        | Поле | Тип | Назначение |
        |---|---|---|
        | `success_url` | string (uri) | возврат пользователя после успешной оплаты |
        | `pending_url` | string (uri) | возврат пользователя, пока оплата не подтверждена |
        | `fail_url` | string (uri) | возврат пользователя после неуспешной оплаты |

        В `h2h` эти поля не используются.

        ## Дополнительные поля

        | Поле | Тип | Описание |
        |---|---|---|
        | `customer_account_id` | integer | числовой ID пользователя в вашей системе |
        | `fields` | object | `first_name`, `last_name`, `middle_name`, `email`, `phone`; все вложенные поля необязательны |

        ## Пример H2H

        ```json
        {
          "order_id": "ORDER-1001-H2H",
          "amount": 1500.00,
          "currency": "RUB",
          "method": "sbp",
          "flow": "h2h",
          "bank": "tbank",
          "traffic_type": "ftd",
          "callback_url": "https://merchant.example/payments/callback"
        }
        ```

        Runnable-сценарий: **«Вариант интеграции h2h → Сценарий 1: Оплата»**.

        ## Пример Redirect

        ```json
        {
          "order_id": "ORDER-1001-REDIRECT",
          "amount": 1500.00,
          "currency": "RUB",
          "method": "sbp",
          "flow": "redirect",
          "bank": "tbank",
          "callback_url": "https://merchant.example/payments/callback",
          "success_url": "https://merchant.example/payments/success",
          "pending_url": "https://merchant.example/payments/pending",
          "fail_url": "https://merchant.example/payments/fail"
        }
        ```

        Runnable-сценарий: **«Вариант интеграции redirectUrl → Сценарий 1: Оплата»**.

        ## Повтор запроса и ключевые ошибки

        | Результат | Новый депозит создан | Что делать |
        |---|---|---|
        | `200`, тот же `order_id` и байт-в-байт то же тело | нет — вернётся ранее созданный | продолжить работу с полученным `transaction_id` |
        | `409 DUPLICATE_ORDER_ID` | нет | для новой попытки использовать новый `order_id` |
        | `422 METHOD_TEMPORARILY_UNAVAILABLE` | нет | повторить позже |
        | `502 SERVICE_TEMPORARILY_UNAVAILABLE` | неизвестно | повторить с тем же `order_id` и байт-в-байт тем же телом |

        Полная матрица и готовые негативные запросы находятся в папке **«Ошибки создания»**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositCreateRequest"
            example:
              order_id: "ORDER-1001"
              amount: 1500.00
              currency: "RUB"
              method: "sbp"
              flow: "redirect"
              psp: "psp-slug"
              bank: "tbank"
              traffic_type: "ftd"
              customer_account_id: 778234
              callback_url: "https://merchant.example/payments/callback"
              success_url: "https://merchant.example/payments/success"
              pending_url: "https://merchant.example/payments/pending"
              fail_url: "https://merchant.example/payments/fail"
              fields:
                first_name: "Иван"
                last_name: "Петров"
                phone: "+79161234567"
      responses:
        "200":
          description: Депозит создан (или возвращён ранее созданный — идемпотентный повтор).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositCreateResponse"
              examples:
                created:
                  summary: Заявка создана — артефакт варианта придёт в GET-статусе
                  value:
                    transaction_id: "9f3c2a71-0d6e-4c1b-8a52-3f9e12ab34cd"
                    order_id: "ORDER-1001"
                    status: "PENDING"
                    stage: "ISSUING_REQUISITES"
                    amount: 1500.00
                    currency: "RUB"
                    expires_at: "2026-07-17T14:45:45Z"
        "400":
          description: "Ошибка валидации: `VALIDATION_ERROR`, `METHOD_NOT_ALLOWED_VALUE`, `BANK_UNKNOWN`, `BANK_NOT_SUPPORTED_FOR_METHOD`, `CURRENCY_NOT_SUPPORTED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: 4001
                  reason: "METHOD_NOT_ALLOWED_VALUE"
                  message: "method must be one of: sbp, c2c, nspk, sber_qr, vtb_qr, transgran, sim_transgran, sim"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Повтор `order_id` с изменённым телом.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: 4090
                  reason: "DUPLICATE_ORDER_ID"
                  message: "order_id already used with a different body"
        "422":
          description: |
            Заявка не создана, `transaction_id` не выдан:
            - `METHOD_TEMPORARILY_UNAVAILABLE` — под запрошенные `method`, `bank` и `traffic_type` сейчас нет живого маршрута; повторите позже;
            - `AMOUNT_OUT_OF_RANGE` — сумма вне допустимого диапазона;
            - `PSP_NOT_FOUND`, `PSP_DISABLED` — только если вы передали поле `psp`: slug не найден либо система отключена.
            - `FLOW_NOT_ALLOWED` — запрошенный `flow` недоступен вашему подключению;
            - `CALLBACK_URL_FORBIDDEN` — `callback_url` не годится как приёмник: не `https`, не публичный
              адрес либо содержит учётные данные. Исправьте адрес — повтор без изменений бесполезен.

            Отличайте от `stage = UNROUTED`: там заявка **создана**, `transaction_id` выдан,
            но ни одна платёжная система не выдала реквизиты — исход `FAILED`, о нём приходит колбэк.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: 4220
                  reason: "METHOD_TEMPORARILY_UNAVAILABLE"
                  message: "no available route for the requested method, bank and traffic type, retry later"
        "413":
          description: |
            Тело запроса больше допустимого (1 МиБ). Проверяется до разбора и до проверки подписи,
            поэтому приходит даже при неверном `x-signature`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: 4000
                  reason: "VALIDATION_ERROR"
                  message: "request body too large"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: Временная недоступность; состояние депозита не определено — повторите позже с тем же `order_id` и тем же телом.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: 5020
                  reason: "SERVICE_TEMPORARILY_UNAVAILABLE"
                  message: "service temporarily unavailable, retry later"
      callbacks:
        statusChanged:
          "{$request.body#/callback_url}":
            post:
              summary: Колбэк о смене статуса депозита
              description: |
                `POST` на ваш `callback_url` при переходе заявки в `SUCCESS`/`FAILED`
                и при каждом пересмотре исхода (возврат, апелляция). Промежуточные этапы
                внутри `PENDING` колбэками не сопровождаются.

                - Подписан той же схемой (`x-api-key`, `x-signature` — HMAC-SHA256 от сырого тела);
                  проверяйте подпись до обработки.
                - Доставка at-least-once: дедуплицируйте по паре `transaction_id` + `occurred_at`. Обработчик должен быть идемпотентным: повторный колбэк с той же парой не должен приводить к повторному зачислению или повторной бизнес-реакции.
                - Порядок доставки не гарантируется — ориентируйтесь на `occurred_at` и данные GET.
                - Суммы, реквизиты и `psp` в колбэк не включаются — после колбэка запросите
                  `GET /v1/deposits/{transaction_id}`.

                Требования к приёмнику: только `https`, публичный адрес, порт 443; успешный приём —
                `HTTP 200` в течение ограниченного времени; редиректы считаются недоставкой.
                При недоставке — повторы с нарастающими интервалами.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/CallbackEvent"
                    example:
                      occurred_at: "2026-07-17T14:41:02.123Z"
                      order_id: "ORDER-1001"
                      transaction_id: "9f3c2a71-0d6e-4c1b-8a52-3f9e12ab34cd"
                      status: "SUCCESS"
                      stage: "SETTLED"
              responses:
                "200":
                  description: Колбэк принят. Любой другой код, таймаут или редирект — недоставка, будет повтор.
  /v1/deposits/{transaction_id}:
    get:
      tags: [Депозиты]
      operationId: getDepositStatus
      summary: Статус депозита
      description: |
        Возвращает текущее состояние депозита — **источник истины о статусе и деньгах**. Успешный запрос возвращает `200`, в том числе пока заявка находится в `PENDING`.

        Подпись GET-запроса считается от пустой строки: `x-signature = hex(HMAC_SHA256(secret_key, ""))`.

        ## `status` и `stage`

        - `status` — денежный исход. Ветвите бизнес-логику только по нему.
        - `stage` — текущий этап для интерфейса, аналитики и разбора инцидентов.

        | `status` | Значение |
        |---|---|
        | `PENDING` | обработка продолжается, денежного исхода ещё нет |
        | `SUCCESS` | деньги получены; зачисляйте `paid_amount` |
        | `FAILED` | деньги не получены либо ранее полученный платёж отозван |

        | `stage` | Что происходит |
        |---|---|
        | `ISSUING_REQUISITES` | платёжная система готовит реквизиты или форму |
        | `AWAITING_PAYMENT` | ждём оплату клиента |
        | `AWAITING_CODE` | ждём подтверждение клиента |
        | `VERIFYING` | проверяем платёж |
        | `DISPUTING` | разбираем спор |
        | `CANCELING` | выполняется отмена |
        | `SETTLED` | платёж подтверждён и зачислен |
        | `EXPIRED` | срок оплаты истёк |
        | `CANCELED` | заявка отменена |
        | `REJECTED`, `UNROUTED`, `ERRORED` | заявка завершилась без оплаты |
        | `REVERSED` | ранее полученные деньги отозваны |

        Порядок этапов внутри `PENDING` не гарантируется: этапы могут пропускаться и появляться без смены версии API. Незнакомый `stage` не должен ломать обработку — продолжайте ориентироваться на `status`.

        Промежуточные изменения `stage` внутри `PENDING` не сопровождаются колбэками; актуальный этап показывает GET.

        ## Суммы

        - `amount` — заявленная вами сумма.
        - `pay_amount` — сумма, которую должен оплатить клиент; если поля нет, используйте `amount`.
        - `paid_amount` — фактически оплаченная сумма; зачисляйте именно её.

        Недоплата или переплата определяется сравнением `paid_amount` с `pay_amount` либо `amount`. Отдельного статуса или этапа для расхождения нет.

        ## Артефакт оплаты

        - `h2h`: полные `requisites` и `pay_amount`; клиент платит по ним.
        - `redirect`: `redirect_url`; клиента нужно направить на форму для оплаты.
        - `requisites` в Redirect — маскированная справочная копия, не платёжные реквизиты.

        ## Колбэки

        При смене исхода Сервис отправляет `POST` на `callback_url`.

        | Поле | Значение |
        |---|---|
        | `occurred_at` | время события UTC; вместе с `transaction_id` используется для дедупликации |
        | `order_id` | ваш ID заказа |
        | `transaction_id` | ID депозита в Сервисе |
        | `status` | `SUCCESS` или `FAILED`; `PENDING` колбэком не приходит |
        | `stage` | этап, на котором оказалась заявка |

        ```json
        {
          "occurred_at": "2026-07-17T14:41:02.123Z",
          "order_id": "ORDER-1001",
          "transaction_id": "9f3c2a71-0d6e-4c1b-8a52-3f9e12ab34cd",
          "status": "SUCCESS",
          "stage": "SETTLED"
        }
        ```

        - Проверяйте `x-signature` до обработки. Заголовок `x-api-key` указывает, каким ключом подписан колбэк.
        - Доставка at-least-once, порядок не гарантируется.
        - Дедуплицируйте по `transaction_id + occurred_at`; обработчик должен быть идемпотентным.
        - В колбэке нет сумм и реквизитов: после него всегда запрашивайте GET.
        - Возврат и апелляция также сопровождаются новым колбэком.
        - Приёмник должен быть публичным HTTPS-адресом на порту 443 и отвечать `200`; редирект считается недоставкой. При недоставке Сервис повторяет отправку с нарастающими интервалами.
        - Postman mock исходящих колбэков не отправляет.

        ## Поля ответа

        | Поле | Тип | Когда присутствует | Описание |
        |---|---|---|---|
        | `order_id`, `transaction_id` | string | всегда | ваш ID и ID депозита в Сервисе |
        | `status` | string | всегда | `PENDING` \| `SUCCESS` \| `FAILED` |
        | `stage` | string | всегда | текущий этап жизненного цикла |
        | `method` | string | всегда | платёжный метод |
        | `amount` | number | всегда | заявленная сумма |
        | `currency` | string | всегда | `RUB` |
        | `bank` | string | если применимо | код банка выданного реквизита |
        | `psp` | string | после выдачи реквизитов | PSP, фактически выдавшая реквизиты |
        | `pay_amount` | number | если отличается от `amount` | сумма к оплате |
        | `redirect_url` | string (uri) | Redirect: когда форма готова | форма для оплаты |
        | `paid_amount` | number | после получения платежа | фактически оплаченная сумма |
        | `requisites` | object | после выдачи, пока заявка ждёт оплату; после исхода сохраняются только при `EXPIRED` | H2H — платёжные; Redirect — маскированная копия |
        | `reversal` | object | после возврата | `occurred_at`, `amount`, `reason`; остаётся в ответе |
        | `error` | object | при `status = FAILED` | только человекочитаемый `message` |
        | `account_number`, `destination_account_number` | string | если применимо | маскированные реквизиты |
        | `created_at`, `updated_at`, `expires_at`, `paid_at` | date-time | по мере наступления | временные метки UTC |
      parameters:
        - name: transaction_id
          in: path
          required: true
          description: ID депозита в Сервисе (UUID из ответа создания депозита).
          schema:
            type: string
            format: uuid
          example: "9f3c2a71-0d6e-4c1b-8a52-3f9e12ab34cd"
      responses:
        "200":
          description: Текущее состояние депозита.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositStatusResponse"
              examples:
                issuing:
                  summary: Реквизиты подбираются — поля `psp` ещё нет
                  description: |
                    Заявка создана с `psp: "psp-slug"` в запросе, но реквизиты ещё не выданы —
                    поля `psp` в ответе нет. Оно придёт вместе с реквизитами и при закреплённом
                    маршруте совпадёт с закреплённым slug.
                  value:
                    order_id: "ORDER-1003"
                    transaction_id: "7c1e9b48-3a25-4f60-b7d1-6e0a5c8d92f3"
                    status: "PENDING"
                    stage: "ISSUING_REQUISITES"
                    method: "sbp"
                    amount: 1500.00
                    currency: "RUB"
                    created_at: "2026-07-17T14:35:45Z"
                    updated_at: "2026-07-17T14:35:45Z"
                    expires_at: "2026-07-17T14:45:45Z"
                pending:
                  summary: Ожидание оплаты (sbp)
                  value:
                    order_id: "ORDER-1001"
                    transaction_id: "9f3c2a71-0d6e-4c1b-8a52-3f9e12ab34cd"
                    status: "PENDING"
                    stage: "AWAITING_PAYMENT"
                    method: "sbp"
                    bank: "tbank"
                    psp: "psp-slug"
                    redirect_url: "https://pay.example/p/ab12cd34ef56"
                    amount: 1500.00
                    pay_amount: 1500.37
                    currency: "RUB"
                    requisites:
                      phone: "+7926***6543"
                      bank: "tbank"
                      bank_name: "Т-Банк"
                      recipient_name: "Пётр С."
                    created_at: "2026-07-17T14:35:45Z"
