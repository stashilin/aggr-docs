<text x="1272" y="371.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#64748B" font-weight="normal" text-anchor="middle">итог и суммы — в ответе</text>
<text x="1272" y="388.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#64748B" font-weight="normal" text-anchor="middle">на запрос статуса</text>
