<rect x="588.0" y="120.0" width="224" height="96" rx="13" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/><text x="700" y="146.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#D97706" font-weight="700" text-anchor="middle" letter-spacing="1.5">H2H — ОПЛАТА У ВАС</text><text x="700" y="172.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#0F172A" font-weight="normal" text-anchor="middle">реквизиты показываются</text><text x="700" y="192.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#0F172A" font-weight="normal" text-anchor="middle">в интерфейсе мерчанта</text>
<rect x="588.0" y="308.0" width="224" height="96" rx="13" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/><text x="700" y="334.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#D97706" font-weight="700" text-anchor="middle" letter-spacing="1.5">REDIRECT — НА ФОРМЕ</text><text x="700" y="360.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#0F172A" font-weight="normal" text-anchor="middle">клиент уходит на форму</text><text x="700" y="380.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#0F172A" font-weight="normal" text-anchor="middle">и возвращается</text>
<text x="700" y="438.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#64748B" font-weight="normal" text-anchor="middle" font-style="italic">различие только в том,</text>
<text x="700" y="456.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#64748B" font-weight="normal" text-anchor="middle" font-style="italic">где клиент видит реквизиты</text>
<rect x="905.0" y="198.0" width="210" height="128" rx="13" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/><text x="1010" y="224.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#64748B" font-weight="700" text-anchor="middle" letter-spacing="1.5">АКТ 4 · ПРОВЕРКА</text><text x="1010" y="250.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#0F172A" font-weight="600" text-anchor="middle">уведомление:</text><text x="1010" y="270.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#64748B" font-weight="normal" text-anchor="middle">«состояние изменилось»</text><text x="1010" y="290.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#2563EB" font-weight="700" text-anchor="middle">→ запрос статуса</text>
