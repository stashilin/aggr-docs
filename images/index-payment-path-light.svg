<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Путь платежа: создание, подготовка, оплата клиента, проверка, исход">
<text x="700.0" y="50" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#0F172A" font-weight="700" text-anchor="middle">Путь платежа</text>
<text x="700.0" y="80" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#64748B" font-weight="normal" text-anchor="middle">пять актов — от создания заявки до исхода</text>
<rect x="57.0" y="203.0" width="190" height="118" rx="13" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="152" y="229.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#2563EB" font-weight="700" text-anchor="middle" letter-spacing="1.5">АКТ 1 · МЕРЧАНТ</text><text x="152" y="255.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#0F172A" font-weight="700" text-anchor="middle">Создание</text><text x="152" y="275.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#64748B" font-weight="normal" text-anchor="middle">мерчант создаёт</text><text x="152" y="295.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#64748B" font-weight="normal" text-anchor="middle">заявку</text>
<text x="152" y="351.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#64748B" font-weight="normal" text-anchor="middle">реквизитов ещё нет —</text>
<text x="152" y="368.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#64748B" font-weight="normal" text-anchor="middle">они появятся следующим</text>
<text x="152" y="385.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#64748B" font-weight="normal" text-anchor="middle">запросом статуса</text>
<rect x="66.0" y="402.0" width="172" height="26" rx="13" fill="#E2E8F0"/><text x="152" y="419.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#475569" font-weight="600" text-anchor="middle" letter-spacing="0.4">ISSUING_REQUISITES</text>
<rect x="297.0" y="203.0" width="190" height="118" rx="13" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/><text x="392" y="229.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#64748B" font-weight="700" text-anchor="middle" letter-spacing="1.5">АКТ 2 · СЕРВИС</text><text x="392" y="255.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#0F172A" font-weight="700" text-anchor="middle">Подготовка</text><text x="392" y="275.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#64748B" font-weight="normal" text-anchor="middle">сервис получает реквизиты</text><text x="392" y="295.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#64748B" font-weight="normal" text-anchor="middle">от платёжной системы</text>
