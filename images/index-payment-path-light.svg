<rect x="1211.0" y="231.0" width="122" height="26" rx="13" fill="#DCFCE7"/><text x="1272" y="248.5" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16A34A" font-weight="600" text-anchor="middle" letter-spacing="0.4">SUCCESS</text>
